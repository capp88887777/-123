<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>大韓民國 상단</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:
        "Noto Sans KR",
        "Malgun Gothic",
        sans-serif;
    background:#f7f3ff;
    color:#333;
}

button,
input,
select{
    font-family:inherit;
}

/* =========================
   상단 배너
========================= */

.header{
    position:relative;
    min-height:260px;
    padding:35px 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;

    background:
        linear-gradient(
            135deg,
            #dff5ff,
            #eee4ff,
            #fff1d6
        );
}

.header::before{
    content:"☁️   ☁️      ✨        ☁️";
    position:absolute;
    top:20px;
    left:0;
    width:100%;
    text-align:center;
    font-size:35px;
    opacity:.8;
}

.header-box{
    position:relative;
    z-index:2;
    text-align:center;
}

.title{
    margin:0;
    font-size:45px;
    font-weight:900;
    letter-spacing:3px;
    color:#6b4e9b;
    text-shadow:
        2px 2px 0 white,
        0 4px 12px rgba(0,0,0,.12);
}

.subtitle{
    margin-top:10px;
    font-size:18px;
    font-weight:700;
    color:#735f91;
}

.server{
    display:inline-block;
    margin-top:12px;
    padding:7px 18px;
    border-radius:30px;
    background:white;
    color:#8063ad;
    font-weight:bold;
    box-shadow:0 4px 12px rgba(0,0,0,.1);
}

.admin-btn{
    margin-top:18px;
    border:0;
    padding:12px 24px;
    border-radius:30px;
    background:linear-gradient(135deg,#ffd86b,#ffb84d);
    color:#654500;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 5px 12px rgba(0,0,0,.15);
}

.admin-btn:hover{
    transform:translateY(-2px);
}

/* =========================
   전체
========================= */

.container{
    width:min(1400px,94%);
    margin:25px auto 60px;
}

/* =========================
   통계
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat{
    background:white;
    border-radius:20px;
    padding:20px;
    text-align:center;
    box-shadow:0 5px 18px rgba(70,50,100,.08);
}

.stat-title{
    color:#888;
    font-size:14px;
}

.stat-number{
    margin-top:5px;
    font-size:30px;
    font-weight:900;
    color:#7354a1;
}

/* =========================
   검색
========================= */

.search-box{
    background:white;
    padding:18px;
    border-radius:20px;
    box-shadow:0 5px 18px rgba(70,50,100,.08);
    margin-bottom:20px;
}

.search-row{
    display:grid;
    grid-template-columns:2fr 1fr 1fr 1fr;
    gap:10px;
}

.search-row input,
.search-row select{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:12px;
    outline:none;
    background:#fff;
}

.search-row input:focus,
.search-row select:focus{
    border-color:#a78bd0;
}

/* =========================
   임원진
========================= */

.section-title{
    font-size:23px;
    font-weight:900;
    color:#62458e;
    margin:25px 0 12px;
}

.executives{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(190px,1fr));
    gap:12px;
}

.exec-card{
    background:white;
    border-radius:18px;
    padding:17px;
    box-shadow:0 5px 15px rgba(70,50,100,.08);
    border:1px solid #eee;
}

.exec-name{
    font-size:19px;
    font-weight:900;
    color:#5f4784;
}

.exec-duty{
    margin-top:5px;
    color:#999;
    font-size:13px;
}

/* =========================
   테이블
========================= */

.table-wrap{
    background:white;
    border-radius:20px;
    box-shadow:0 5px 18px rgba(70,50,100,.08);
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:950px;
}

th{
    background:#eee7fa;
    color:#634987;
    padding:14px 10px;
    font-size:14px;
    white-space:nowrap;
}

td{
    padding:13px 10px;
    border-bottom:1px solid #eee;
    text-align:center;
    font-size:14px;
}

tr:hover td{
    background:#faf8ff;
}

.name{
    font-weight:900;
    color:#59427b;
}

.badge{
    display:inline-block;
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.badge.yes{
    background:#e2f8e9;
    color:#32804c;
}

.badge.no{
    background:#f2f2f2;
    color:#999;
}

/* =========================
   관리자
========================= */

.admin-panel{
    display:none;
    margin-bottom:20px;
    background:white;
    border-radius:20px;
    padding:20px;
    box-shadow:0 5px 18px rgba(70,50,100,.1);
    border:2px solid #eadfff;
}

.admin-panel.active{
    display:block;
}

.admin-title{
    font-size:20px;
    font-weight:900;
    color:#65478e;
    margin-bottom:15px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.form-grid input,
.form-grid select{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:12px;
}

.check-area{
    display:flex;
    gap:20px;
    align-items:center;
    padding:10px 0;
}

.admin-actions{
    display:flex;
    gap:8px;
    margin-top:15px;
    flex-wrap:wrap;
}

.btn{
    border:0;
    border-radius:12px;
    padding:10px 16px;
    cursor:pointer;
    font-weight:bold;
}

.btn-add{
    background:#dff5e5;
    color:#28743e;
}

.btn-save{
    background:#e9ddff;
    color:#63448d;
}

.btn-cancel{
    background:#eee;
    color:#666;
}

.btn-delete{
    background:#ffe1e1;
    color:#a43d3d;
}

.btn-backup{
    background:#dff2ff;
    color:#39729a;
}

/* =========================
   모바일
========================= */

@media(max-width:800px){

    .header{
        min-height:220px;
    }

    .title{
        font-size:32px;
    }

    .subtitle{
        font-size:14px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .search-row{
        grid-template-columns:1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .container{
        width:96%;
    }

}
</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="header-box">

        <h1 class="title">大韓民國</h1>

        <div class="subtitle">
            대한민국 상단
        </div>

        <div class="server">
            🐢 현무서버
        </div>

        <br>

        <button class="admin-btn"
                onclick="adminLogin()">
            🔐 관리자 인증 모드
        </button>

    </div>

</header>


<div class="container">

    <!-- =========================
         관리자 패널
    ========================= -->

    <div id="adminPanel"
         class="admin-panel">

        <div class="admin-title">
            🛠 관리자 회원 관리
        </div>

        <div class="form-grid">

            <input
                id="name"
                placeholder="본캐 닉네임">

            <input
                id="subs"
                placeholder="부캐릭터">

            <input
                id="duty"
                placeholder="직책">

            <select id="king">

                <option value="보유 없음">
                    사천왕 - 보유 없음
                </option>

                <option value="지국천왕">
                    지국천왕
                </option>

                <option value="다문천왕">
                    다문천왕
                </option>

                <option value="광목천왕">
                    광목천왕
                </option>

                <option value="증장천왕">
                    증장천왕
                </option>

            </select>

            <select id="position">

                <option value="상단명단">
                    일반 상단원
                </option>

                <option value="임원진">
                    임원진
                </option>

            </select>

            <input
                id="note"
                placeholder="비고">

        </div>

        <div class="check-area">

            <label>
                <input
                    type="checkbox"
                    id="is2nd">
                2차 완료
            </label>

            <label>
                <input
                    type="checkbox"
                    id="isAwaken">
                각성 완료
            </label>

        </div>

        <div class="admin-actions">

            <button
                class="btn btn-add"
                onclick="newMember()">
                ➕ 새 회원
            </button>

            <button
                class="btn btn-save"
                onclick="saveMember()">
                💾 저장
            </button>

            <button
                class="btn btn-cancel"
                onclick="cancelEdit()">
                취소
            </button>

            <button
                class="btn btn-backup"
                onclick="downloadBackup()">
                📥 백업
            </button>

        </div>

    </div>


    <!-- =========================
         통계
    ========================= -->

    <div class="stats">

        <div class="stat">

            <div class="stat-title">
                전체 인원
            </div>

            <div
                class="stat-number"
                id="totalCount">
                0
            </div>

        </div>

        <div class="stat">

            <div class="stat-title">
                임원진
            </div>

            <div
                class="stat-number"
                id="execCount">
                0
            </div>

        </div>

        <div class="stat">

            <div class="stat-title">
                일반 상단원
            </div>

            <div
                class="stat-number"
                id="normalCount">
                0
            </div>

        </div>

    </div>


    <!-- =========================
         검색
    ========================= -->

    <div class="search-box">

        <div class="search-row">

            <input
                id="search"
                placeholder="🔎 닉네임 / 부캐릭터 검색"
                oninput="render()">

            <select
                id="positionFilter"
                onchange="render()">

                <option value="">
                    전체 직책
                </option>

                <option value="임원진">
                    임원진
                </option>

                <option value="상단명단">
                    일반 상단원
                </option>

            </select>

            <select
                id="kingFilter"
                onchange="render()">

                <option value="">
                    전체 사천왕
                </option>

                <option value="지국천왕">
                    지국천왕
                </option>

                <option value="다문천왕">
                    다문천왕
                </option>

                <option value="광목천왕">
                    광목천왕
                </option>

                <option value="증장천왕">
                    증장천왕
                </option>

                <option value="보유 없음">
                    보유 없음
                </option>

            </select>

            <select
                id="completeFilter"
                onchange="render()">

                <option value="">
                    전체 완료 여부
                </option>

                <option value="2nd">
                    2차 완료
                </option>

                <option value="awaken">
                    각성 완료
                </option>

            </select>

        </div>

    </div>


    <!-- =========================
         임원진
    ========================= -->

    <div class="section-title">
        👑 임원진
    </div>

    <div
        id="executives"
        class="executives">
    </div>


    <!-- =========================
         명단
    ========================= -->

    <div class="section-title">
        📋 상단 명단
    </div>

    <div class="table-wrap">

        <table>

            <thead>

                <tr>

                    <th>직책</th>
                    <th>본캐 닉네임</th>
                    <th>부캐릭터</th>
                    <th>사천왕</th>
                    <th>2차</th>
                    <th>각성</th>
                    <th>비고</th>
                    <th>관리</th>

                </tr>

            </thead>

            <tbody id="memberList">

            </tbody>

        </table>

    </div>

</div>


<script>

/* =========================================
   Google Apps Script 주소
========================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbyj3TC79wglpRc2XgVUXdtHYm6cUFTeOB3AJ2dDo1FDxDRsXgD_EAcOVDqF1KVAysZLkA/exec";


/* =========================================
   데이터
========================================= */

let members = [];

let editId = null;

let adminMode = false;


/* =========================================
   페이지 시작
========================================= */

window.onload = function(){

    loadMembers();

};


/* =========================================
   Google Sheet에서 명단 불러오기
========================================= */

async function loadMembers(){

    try{

        const response =
            await fetch(API_URL + "?t=" + Date.now());

        const data =
            await response.json();

        if(Array.isArray(data)){

            members = data.map(normalizeMember);

        }else{

            members = [];

        }

        render();

    }catch(error){

        console.error(error);

        alert(
            "구글시트 연결에 실패했습니다.\n\n" +
            "Apps Script 배포 설정을 확인해주세요."
        );

    }

}


/* =========================================
   데이터 정리
========================================= */

function normalizeMember(m){

    return {

        id:
            m.id ||
            ("member_" + Date.now() + Math.random()),

        name:
            m.name || "",

        subs:
            m.subs || "",

        note:
            m.note || "",

        duty:
            m.duty || "",

        king:
            m.king || "보유 없음",

        position:
            m.position || "상단명단",

        is2nd:
            m.is2nd === true ||
            m.is2nd === "true" ||
            m.is2nd === "TRUE",

        isAwaken:
            m.isAwaken === true ||
            m.isAwaken === "true" ||
            m.isAwaken === "TRUE"

    };

}


/* =========================================
   관리자 로그인
========================================= */

function adminLogin(){

    if(adminMode){

        adminMode = false;

        document
            .getElementById("adminPanel")
            .classList.remove("active");

        render();

        return;

    }

    const password =
        prompt("관리자 비밀번호를 입력하세요.");

    if(password === "1234"){

        adminMode = true;

        document
            .getElementById("adminPanel")
            .classList.add("active");

        alert("관리자 모드가 활성화되었습니다.");

    }else{

        alert("비밀번호가 틀렸습니다.");

    }

}


/* =========================================
   화면 렌더링
========================================= */

function render(){

    const search =
        document
        .getElementById("search")
        .value
        .toLowerCase()
        .trim();

    const position =
        document
        .getElementById("positionFilter")
        .value;

    const king =
        document
        .getElementById("kingFilter")
        .value;

    const complete =
        document
        .getElementById("completeFilter")
        .value;


    let filtered =
        members.filter(m => {

            const text =
                (
                    m.name +
                    " " +
                    m.subs +
                    " " +
                    m.duty
                ).toLowerCase();

            if(
                search &&
                !text.includes(search)
            ){
                return false;
            }

            if(
                position &&
                m.position !== position
            ){
                return false;
            }

            if(
                king &&
                m.king !== king
            ){
                return false;
            }

            if(
                complete === "2nd" &&
                !m.is2nd
            ){
                return false;
            }

            if(
                complete === "awaken" &&
                !m.isAwaken
            ){
                return false;
            }

            return true;

        });


    /* 통계 */

    const executives =
        members.filter(
            m => m.position === "임원진"
        );

    const normal =
        members.filter(
            m => m.position !== "임원진"
        );


    document
        .getElementById("totalCount")
        .textContent =
        members.length;

    document
        .getElementById("execCount")
        .textContent =
        executives.length;

    document
        .getElementById("normalCount")
        .textContent =
        normal.length;


    /* 임원진 카드 */

    const execBox =
        document.getElementById("executives");

    execBox.innerHTML = "";

    executives.forEach(m => {

        execBox.innerHTML += `

            <div class="exec-card">

                <div class="exec-name">
                    👑 ${escapeHTML(m.name)}
                </div>

                <div class="exec-duty">
                    ${escapeHTML(m.duty || "임원진")}
                </div>

            </div>

        `;

    });


    /* 명단 */

    const list =
        document.getElementById("memberList");

    list.innerHTML = "";


    filtered.forEach(m => {

        list.innerHTML += `

            <tr>

                <td>
                    ${escapeHTML(
                        m.duty || "-"
                    )}
                </td>

                <td class="name">
                    ${escapeHTML(m.name)}
                </td>

                <td>
                    ${escapeHTML(
                        m.subs || "-"
                    )}
                </td>

                <td>
                    ${escapeHTML(m.king)}
                </td>

                <td>
                    ${
                        m.is2nd
                        ? '<span class="badge yes">완료</span>'
                        : '<span class="badge no">미완료</span>'
                    }
                </td>

                <td>
                    ${
                        m.isAwaken
                        ? '<span class="badge yes">완료</span>'
                        : '<span class="badge no">미완료</span>'
                    }
                </td>

                <td>
                    ${escapeHTML(
                        m.note || "-"
                    )}
                </td>

                <td>

                    ${
                        adminMode
                        ? `
                            <button
                                class="btn btn-save"
                                onclick="editMember('${m.id}')">
                                수정
                            </button>

                            <button
                                class="btn btn-delete"
                                onclick="deleteMember('${m.id}')">
                                삭제
                            </button>
                        `
                        : "-"
                    }

                </td>

            </tr>

        `;

    });

}


/* =========================================
   새 회원
========================================= */

function newMember(){

    editId = null;

    document.getElementById("name").value = "";
    document.getElementById("subs").value = "";
    document.getElementById("duty").value = "";
    document.getElementById("note").value = "";

    document.getElementById("king").value =
        "보유 없음";

    document.getElementById("position").value =
        "상단명단";

    document.getElementById("is2nd").checked =
        false;

    document.getElementById("isAwaken").checked =
        false;

}


/* =========================================
   회원 수정
========================================= */

function editMember(id){

    const member =
        members.find(
            m => String(m.id) === String(id)
        );

    if(!member) return;

    editId = id;

    document.getElementById("name").value =
        member.name;

    document.getElementById("subs").value =
        member.subs;

    document.getElementById("duty").value =
        member.duty;

    document.getElementById("note").value =
        member.note;

    document.getElementById("king").value =
        member.king;

    document.getElementById("position").value =
        member.position;

    document.getElementById("is2nd").checked =
        member.is2nd;

    document.getElementById("isAwaken").checked =
        member.isAwaken;


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================================
   저장
========================================= */

async function saveMember(){

    if(!adminMode){

        alert("관리자 모드가 필요합니다.");

        return;

    }


    const name =
        document
        .getElementById("name")
        .value
        .trim();


    if(!name){

        alert("본캐 닉네임을 입력해주세요.");

        return;

    }


    const member = {

        id:
            editId ||
            createId(),

        name:name,

        subs:
            document
            .getElementById("subs")
            .value
            .trim(),

        duty:
            document
            .getElementById("duty")
            .value
            .trim(),

        note:
            document
            .getElementById("note")
            .value
            .trim(),

        king:
            document
            .getElementById("king")
            .value,

        position:
            document
            .getElementById("position")
            .value,

        is2nd:
            document
            .getElementById("is2nd")
            .checked,

        isAwaken:
            document
            .getElementById("isAwaken")
            .checked

    };


    if(editId){

        const index =
            members.findIndex(
                m =>
                String(m.id) ===
                String(editId)
            );

        if(index !== -1){

            members[index] = member;

        }

    }else{

        members.push(member);

    }


    await saveAll();

}


/* =========================================
   삭제
========================================= */

async function deleteMember(id){

    if(!confirm(
        "정말 삭제하시겠습니까?"
    )){

        return;

    }


    members =
        members.filter(
            m =>
            String(m.id) !==
            String(id)
        );


    await saveAll();

}


/* =========================================
   Google Sheet 저장
========================================= */

async function saveAll(){

    try{

        const response =
            await fetch(API_URL, {

                method:"POST",

                headers:{
                    "Content-Type":
                        "text/plain;charset=utf-8"
                },

                body:
                    JSON.stringify(members)

            });


        const result =
            await response.json();


        if(
            result.result !==
            "success"
        ){

            throw new Error(
                result.message ||
                "저장 실패"
            );

        }


        editId = null;

        render();

        alert(
            "저장되었습니다.\n" +
            "Google Sheet에도 반영되었습니다."
        );


    }catch(error){

        console.error(error);

        alert(
            "저장에 실패했습니다.\n\n" +
            error.message
        );

    }

}


/* =========================================
   취소
========================================= */

function cancelEdit(){

    editId = null;

    newMember();

}


/* =========================================
   ID
========================================= */

function createId(){

    return "member_" +
        Date.now() +
        "_" +
        Math.floor(
            Math.random() * 100000
        );

}


/* =========================================
   백업
========================================= */

function downloadBackup(){

    const blob =
        new Blob(
            [
                JSON.stringify(
                    members,
                    null,
                    2
                )
            ],
            {
                type:
                "application/json"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement("a");


    const date =
        new Date()
        .toISOString()
        .slice(0,10);


    a.href = url;

    a.download =
        "대한민국상단_백업_" +
        date +
        ".json";


    a.click();

    URL.revokeObjectURL(url);

}


/* =========================================
   HTML 문자 안전 처리
========================================= */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}
