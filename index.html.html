<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大韓國 상단 - 현무서버</title>

    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Malgun Gothic', sans-serif; padding: 0; margin: 0; background-color: #ffffff; color: #333; }

        .header { background: linear-gradient(180deg, #444 0%, #222 100%); text-align: center; padding: 40px 20px; color: white; }
        .title-main { font-size: 36px; font-weight: bold; margin-bottom: 5px; letter-spacing: 2px; }
        .server-tag { background: #b8860b; color: #fff; padding: 3px 15px; border-radius: 15px; font-size: 14px; display: inline-block; margin-bottom: 5px; font-weight: bold; }
        .title-sub { font-size: 22px; font-weight: bold; color: #eee; }
        
        .admin-btn-container { margin-top: 15px; text-align: center; }
        .admin-btn { background: #b8860b; color: #fff; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .admin-btn:hover { background: #966f0a; }

        .content { max-width: 800px; margin: 3px auto; padding: 20px; }

        .search-box { margin: 5px 0 20px 0; position: relative; }
        .search-input { width: 100%; padding: 13px 45px 13px 15px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; outline: none; background: #fafafa; }
        .search-input:focus { border-color: #b8860b; background: #fff; }
        .search-icon { position: absolute; right: 15px; top: 11px; font-size: 18px; color: #888; pointer-events: none; }

        .section-title { font-size: 18px; font-weight: bold; color: #b8860b; margin-top: 30px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .member-count { font-size: 15px; color: #777; font-weight: bold; margin-left: 4px; }

        .pw-box { display: none; background: #fff; border: 2px solid #b8860b; padding: 15px; text-align: center; max-width: 300px; margin: 15px auto; border-radius: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .pw-box p { margin: 0 0 10px 0; font-size: 14px; font-weight: bold; color: #000; }
        .pw-box input { padding: 8px; border: 1px solid #ccc; width: 120px; border-radius: 4px; font-size: 14px; color: #000; }
        .pw-box button { background: #111; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-left: 5px; }

        .admin-panel { display: none; background: #f9f9f9; border: 2px solid #b8860b; padding: 20px; margin-top: 15px; border-radius: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .admin-panel h3 { margin-top: 0; color: #222; font-size: 16px; margin-bottom: 15px; }

        .form-row { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
        .form-row input, .form-row select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .checkbox-group { display: flex; gap: 15px; font-size: 14px; font-weight: bold; color: #555; }

        .btn-submit { background: #b8860b; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .btn-submit:hover { background: #966f0a; }
        .btn-cancel { background: #777; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; display: none; }
        .btn-cancel:hover { background: #555; }

        .data-sync-box { margin-top: 20px; padding-top: 15px; border-top: 1px dashed #ccc; display: flex; }
        .btn-backup { background: #2e7d32; color: white; border: none; padding: 10px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; width: 100%; }
        .btn-backup:hover { background: #1b5e20; }

        .member-list { list-style: none; padding: 0; margin: 0; }
        .member-item { display: flex; align-items: center; padding: 15px 10px; border-bottom: 1px solid #eee; }
        .tag-box { display: flex; flex-direction: column; gap: 4px; width: 80px; margin-right: 15px; flex-shrink: 0; }
        .status-tag { border: 1px solid #d4c4a8; background-color: #faf7f2; color: #705e43; font-size: 11px; padding: 3px 0; border-radius: 2px; text-align: center; font-weight: bold; }
        .status-tag.empty { border: 1px dashed #eee; background-color: transparent; color: #ccc; }
        .info-box { flex-grow: 1; min-width: 0; }
        .name-line { font-size: 18px; font-weight: bold; color: #222; margin-bottom: 4px; word-break: break-word; }
        .name-line span { font-size: 16px; font-weight: normal; color: #555; }
        .detail-line { font-size: 13px; color: #777; }

        .admin-actions { display: flex; gap: 5px; margin-left: 10px; flex-shrink: 0; }
        .btn-edit { background: #555; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .btn-delete { background: #ff4d4d; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }

        .no-result { display: none; text-align: center; padding: 30px 10px; color: #999; font-size: 14px; }
    </style>
</head>

<body>

<div class="header">
    <div class="title-main">大韓國 상단</div>
    <div class="server-tag">현무서버</div>
    <div class="title-sub">대한민국 상단 사천왕 보유 현황</div>
    <div class="admin-btn-container">
        <button class="admin-btn" id="loginBtn" type="button">⚙️ 관리자 인증 모드</button>
    </div>
</div>

<div class="content">
    <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="🔎 본캐, 부캐, 사천왕, 직책 검색..." autocomplete="off">
        <span class="search-icon">🔍</span>
    </div>

    <div id="pwBox" class="pw-box">
        <p>비밀번호를 입력하세요</p>
        <input type="password" id="adminPw" placeholder="암호 입력" autocomplete="off">
        <button type="button" id="pwSubmitBtn">확인</button>
    </div>

    <div id="adminPanel" class="admin-panel">
        <h3>🛠️ 상단원 정보 관리</h3>
        <div class="form-row">
            <select id="addPosition">
                <option value="임원진">임원진</option>
                <option value="상단명단">일반 상단원</option>
            </select>
            <input type="text" id="addName" style="width:130px;" placeholder="본캐 닉네임">
            <input type="text" id="addSubs" style="width:180px;" placeholder="부캐릭터 (쉼표 분리)">
            <input type="text" id="addDuty" style="width:100px;" placeholder="직책 (예: 대행수)">
            <select id="addKing">
                <option value="지국천왕">지국천왕</option>
                <option value="다문천왕">다문천왕</option>
                <option value="광목천왕">광목천왕</option>
                <option value="증장천왕">증장천왕</option>
                <option value="보유 없음">보유 없음</option>
            </select>
        </div>

        <div class="form-row">
            <div class="checkbox-group">
                <label><input type="checkbox" id="check2nd"> 2차 완료</label>
                <label><input type="checkbox" id="checkAwaken"> 각성 완료</label>
            </div>
            <button class="btn-submit" id="submitBtn" type="button" style="margin-left:auto;">등록하기</button>
            <button class="btn-cancel" id="cancelBtn" type="button">수정 취소</button>
        </div>

        <div class="data-sync-box">
            <button class="btn-backup" type="button" id="exportBtn">📊 상단원 명부 엑셀 다운로드 (CSV)</button>
        </div>
    </div>

    <div class="section-title">
        01 임원진 <span class="member-count" id="executiveCount">(00)</span>
    </div>
    <ul id="executiveList" class="member-list"></ul>
    <div id="executiveNoResult" class="no-result">검색 결과가 없습니다.</div>

    <div class="section-title">
        02 상단명단 <span class="member-count" id="regularCount">(00)</span>
    </div>
    <ul id="regularList" class="member-list"></ul>
    <div id="regularNoResult" class="no-result">검색 결과가 없습니다.</div>
</div>

<script>
    var GAS_URL = "https://script.google.com/macros/s/AKfycbzjygLTVz8nurCfmEHlESWoff1_JOzky392EAsFB60iIHzjrhxN7W1Gsc4uw9_y2V1OFw/exec";

    var members = [];
    var editingIndex = -1;

    function loadMemberData() {
        if (!GAS_URL) return;
        fetch(GAS_URL)
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (Array.isArray(data)) {
                    members = data;
                    renderLists();
                }
            })
            .catch(function(err) {
                console.error("데이터 불러오기 실패:", err);
            });
    }

    function saveMemberData() {
        if (!GAS_URL) return;
        fetch(GAS_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(members)
        }).catch(function(err) {
            console.error("데이터 저장 실패:", err);
        });
    }

    function isAdminLoggedIn() {
        return sessionStorage.getItem('is_admin_logged_in') === 'true';
    }

    function checkSessionAdminState() {
        var adminPanel = document.getElementById('adminPanel');
        var loginBtn = document.getElementById('loginBtn');
        if (isAdminLoggedIn()) {
            if (adminPanel) adminPanel.style.display = 'block';
            if (loginBtn) loginBtn.innerText = '🔒 관리자 모드 종료';
        }
    }

    function togglePasswordInputBox() {
        var pwBox = document.getElementById('pwBox');
        var adminPanel = document.getElementById('adminPanel');
        var loginBtn = document.getElementById('loginBtn');

        if (isAdminLoggedIn()) {
            sessionStorage.removeItem('is_admin_logged_in');
            if (adminPanel) adminPanel.style.display = 'none';
            if (loginBtn) loginBtn.innerText = '⚙️ 관리자 인증 모드';
            cancelEdit();
            renderLists();
            return;
        }

        if (pwBox) {
            if (pwBox.style.display === 'block') {
                pwBox.style.display = 'none';
            } else {
                pwBox.style.display = 'block';
                var input = document.getElementById('adminPw');
                if (input) {
                    input.value = '';
                    setTimeout(function() { input.focus(); }, 100);
                }
            }
        }
    }

    function checkAdminPassword() {
        var input = document.getElementById('adminPw');
        if (!input) return;
        if (input.value.trim() === '1357') {
            sessionStorage.setItem('is_admin_logged_in', 'true');
            document.getElementById('pwBox').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('loginBtn').innerText = '🔒 관리자 모드 종료';
            input.value = '';
            renderLists();
        } else {
            alert('비밀번호가 올바르지 않습니다.');
            input.value = '';
            input.focus();
        }
    }

    function renderLists() {
        var execContainer = document.getElementById('executiveList');
        var regContainer = document.getElementById('regularList');
        if (!execContainer || !regContainer) return;

        execContainer.innerHTML = '';
        regContainer.innerHTML = '';

        var keyword = (document.getElementById('searchInput').value || '').trim().toLowerCase();

        var execCount = 0;
        var regCount = 0;

        members.forEach(function(member, index) {
            var searchText = [member.name, member.subs, member.duty, member.king, member.position].join(' ').toLowerCase();
            if (keyword && searchText.indexOf(keyword) === -1) return;

            var li = document.createElement('li');
            li.className = 'member-item';

            var tag1 = member.is2nd ? '<div class="status-tag">2차 완료</div>' : '<div class="status-tag empty">-</div>';
            var tag2 = member.isAwaken ? '<div class="status-tag">각성 완료</div>' : '<div class="status-tag empty">-</div>';
            var subsText = member.subs ? ' / ' + member.subs : ' / 없음';
            var dutyText = member.duty ? ' · ' + member.duty : '';

            var actionButtons = '';
            if (isAdminLoggedIn()) {
                actionButtons = '<div class="admin-actions">' +
                    '<button class="btn-edit" type="button" onclick="editMember(' + index + ')">수정</button>' +
                    '<button class="btn-delete" type="button" onclick="deleteMember(' + index + ')">삭제</button>' +
                '</div>';
            }

            li.innerHTML = '<div class="tag-box">' + tag1 + tag2 + '</div>' +
                '<div class="info-box">' +
                    '<div class="name-line">' + (member.name || '') + ' <span>' + subsText + '</span></div>' +
                    '<div class="detail-line">' + (member.king || '') + dutyText + '</div>' +
                '</div>' + actionButtons;

            if (member.position === '임원진') {
                execContainer.appendChild(li);
                execCount++;
            } else {
                regContainer.appendChild(li);
                regCount++;
            }
        });

        document.getElementById('executiveCount').innerText = '(' + String(execCount).padStart(2, '0') + ')';
        document.getElementById('regularCount').innerText = '(' + String(regCount).padStart(2, '0') + ')';
    }

    function saveMember() {
        if (!isAdminLoggedIn()) return alert('관리자 인증이 필요합니다.');

        var name = document.getElementById('addName').value.trim();
        if (!name) return alert('본캐 닉네임을 입력해주세요.');

        var newMember = {
            name: name,
            subs: document.getElementById('addSubs').value.trim(),
            duty: document.getElementById('addDuty').value.trim(),
            king: document.getElementById('addKing').value,
            position: document.getElementById('addPosition').value,
            is2nd: document.getElementById('check2nd').checked,
            isAwaken: document.getElementById('checkAwaken').checked
        };

        if (editingIndex >= 0) {
            members[editingIndex] = newMember;
            alert('정보가 수정되었습니다.');
        } else {
            members.push(newMember);
            alert('상단원이 등록되었습니다.');
        }

        saveMemberData();
        cancelEdit();
        renderLists();
    }

    function editMember(index) {
        var m = members[index];
        if (!m) return;
        editingIndex = index;
        document.getElementById('addPosition').value = m.position || '상단명단';
        document.getElementById('addName').value = m.name || '';
        document.getElementById('addSubs').value = m.subs || '';
        document.getElementById('addDuty').value = m.duty || '';
        document.getElementById('addKing').value = m.king || '보유 없음';
        document.getElementById('check2nd').checked = !!m.is2nd;
        document.getElementById('checkAwaken').checked = !!m.isAwaken;

        document.getElementById('submitBtn').innerText = '수정 완료';
        document.getElementById('cancelBtn').style.display = 'inline-block';
    }

    function cancelEdit() {
        editingIndex = -1;
        document.getElementById('addPosition').value = '상단명단';
        document.getElementById('addName').value = '';
        document.getElementById('addSubs').value = '';
        document.getElementById('addDuty').value = '';
        document.getElementById('addKing').value = '지국천왕';
        document.getElementById('check2nd').checked = false;
        document.getElementById('checkAwaken').checked = false;
        document.getElementById('submitBtn').innerText = '등록하기';
        document.getElementById('cancelBtn').style.display = 'none';
    }

    function deleteMember(index) {
        if (confirm("정말 삭제하시겠습니까?")) {
            members.splice(index, 1);
            saveMemberData();
            renderLists();
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        loadMemberData();
        checkSessionAdminState();

        // 관리자 모드 버튼 클릭 이벤트 직접 연결
        var loginBtn = document.getElementById('loginBtn');
        if (loginBtn) {
            loginBtn.addEventListener('click', togglePasswordInputBox);
        }

        var pwSubmitBtn = document.getElementById('pwSubmitBtn');
        if (pwSubmitBtn) {
            pwSubmitBtn.addEventListener('click', checkAdminPassword);
        }

        var adminPwInput = document.getElementById('adminPw');
        if (adminPwInput) {
            adminPwInput.addEventListener('keyup', function(e) {
                if (e.key === 'Enter') checkAdminPassword();
            });
        }

        var searchInput = document.getElementById('searchInput');
        if (searchInput) {
            searchInput.addEventListener('input', renderLists);
        }

        document.getElementById('submitBtn').addEventListener('click', saveMember);
        document.getElementById('cancelBtn').addEventListener('click', cancelEdit);
    });
</script>

</body>
</html>
