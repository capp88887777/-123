<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大韓民國 상단 - 현무서버</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f3ff;color:#222;font-family:"Noto Sans KR","Malgun Gothic",sans-serif}
button,input,select{font-family:inherit}
.header{position:relative;width:100%;overflow:hidden;background:#eef4ff}
.header img{display:block;width:100%;height:auto;max-height:390px;object-fit:cover;object-position:center top}
.admin-login{
 position:absolute;left:50%;top:78%;bottom:auto;transform:translateX(-50%);z-index:20;
 border:0;border-radius:30px;padding:12px 25px;
 background:#d99b16;color:#fff;font-size:15px;font-weight:900;
 box-shadow:0 5px 14px rgba(0,0,0,.2);cursor:pointer;white-space:nowrap;
}
.admin-login:hover{transform:translateX(-50%) translateY(-2px)}
.container{width:min(1400px,94%);margin:22px auto 45px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.stat{background:#fff;border-radius:20px;padding:18px;text-align:center;box-shadow:0 5px 18px rgba(80,50,120,.08)}
.stat-title{color:#888;font-size:14px}.stat-number{margin-top:5px;font-size:30px;font-weight:900;color:#7250a4}
.search-box{background:#fff;border-radius:20px;padding:16px;margin-bottom:22px;box-shadow:0 5px 18px rgba(80,50,120,.08)}
.search-row{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:10px}
.search-row input,.search-row select,.form-grid input,.form-grid select{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;background:#fff;outline:none}
.search-row input:focus,.search-row select:focus,.form-grid input:focus,.form-grid select:focus{border-color:#9871c7}
.section-title{margin:25px 0 12px;padding-bottom:8px;border-bottom:1px solid #ddd;font-size:22px;font-weight:900;color:#614495}
.executives{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.exec-card{background:#fff;border-radius:15px;padding:15px 10px;min-height:85px;text-align:center;box-shadow:0 5px 15px rgba(80,50,120,.08);transition:.2s}
.exec-card:hover{transform:translateY(-3px)}
.exec-name{font-size:17px;font-weight:900;color:#5e4287}.exec-duty{margin-top:5px;font-size:13px;color:#777}
.table-wrap{width:100%;overflow-x:auto;background:#fff;border-radius:12px;box-shadow:0 5px 18px rgba(80,50,120,.08)}
table{width:100%;min-width:1100px;border-collapse:collapse}
thead th{padding:12px 8px;background:linear-gradient(#b17d18,#96640a);color:#fff;font-size:14px;white-space:nowrap}
tbody td{padding:10px 8px;text-align:center;border-bottom:1px solid #eee;font-size:13px}
tbody tr:hover td{background:#fcfaff}.main-name{font-weight:900;color:#4d3a69}
.king-badge{display:inline-block;min-width:82px;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:900;background:#fff}
.king-jiguk{color:#9148c7;border:2px solid #b86be8;background:#fbf3ff}
.king-damun{color:#2474c7;border:2px solid #67a9ed;background:#f1f8ff}
.king-gwangmok{color:#299452;border:2px solid #70c889;background:#f1fff5}
.king-jeungjang{color:#e78a17;border:2px solid #f0a746;background:#fff8ed}
.king-none{color:#888;border:2px solid #ccc;background:#f7f7f7}
.complete{color:#098331;font-size:18px;font-weight:900}.incomplete{color:#aaa;font-size:15px}
.manage-btn{border:0;border-radius:6px;padding:6px 10px;margin:1px;color:#fff;cursor:pointer;font-size:12px;font-weight:700}
.edit-btn{background:#1769c2}.delete-btn{background:#e33434}
.manage-btn:hover{opacity:.8}
.admin-panel{display:none;margin-top:18px;background:linear-gradient(135deg,#fffdf7,#fff8ea);border:1px solid #e5d3ad;border-radius:12px;padding:18px;box-shadow:0 5px 18px rgba(80,50,120,.08)}
.admin-panel.active{display:block}
.admin-title{font-size:19px;font-weight:900;color:#62471f;margin-bottom:15px}
.form-grid{display:grid;grid-template-columns:1fr 1.4fr 1.4fr 1fr 1fr 1.4fr;gap:9px}
.check-area{display:flex;gap:25px;margin:12px 0}.check-area label{font-size:14px;font-weight:700}
.admin-actions{display:flex;gap:8px;flex-wrap:wrap}
.admin-btn{border:0;border-radius:8px;padding:10px 17px;cursor:pointer;font-weight:800}
.add-btn{background:#c28b12;color:#fff}.save-btn{background:#208342;color:#fff}.cancel-btn{background:#999;color:#fff}.backup-btn{background:#3377ae;color:#fff}.restore-label{background:#6d55a5;color:#fff;border-radius:8px;padding:10px 17px;cursor:pointer;font-weight:800}
footer{text-align:center;color:#888;font-size:12px;padding:20px}
.status{text-align:center;color:#777;font-size:12px;margin:10px 0}
@media(max-width:1100px){.executives{grid-template-columns:repeat(3,1fr)}}
@media(max-width:800px){
 .stats{grid-template-columns:1fr}.search-row{grid-template-columns:1fr}.executives{grid-template-columns:repeat(2,1fr)}
 .form-grid{grid-template-columns:1fr}.header img{max-height:none}
 .admin-login{top:76%;padding:10px 18px;font-size:13px}
}
@media(max-width:450px){.executives{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<header class="header">
  <img src="assets/banner.png" alt="大韓民國 상단 현무서버">
  <button class="admin-login" onclick="adminLogin(event)">⚙ 관리자 인증 모드</button>
</header>

<div class="container">

  <div class="stats">
    <div class="stat"><div class="stat-title">전체 인원</div><div class="stat-number" id="totalCount">0</div></div>
    <div class="stat"><div class="stat-title">임원진</div><div class="stat-number" id="execCount">0</div></div>
    <div class="stat"><div class="stat-title">일반 상단원</div><div class="stat-number" id="normalCount">0</div></div>
  </div>

  <div class="search-box">
    <div class="search-row">
      <input id="search" type="text" placeholder="🔎 닉네임 / 부캐릭터 검색..." oninput="render()">
      <select id="positionFilter" onchange="render()">
        <option value="">전체 직책</option>
        <option value="임원진">임원진</option>
        <option value="상단명단">일반 상단원</option>
      </select>
      <select id="kingFilter" onchange="render()">
        <option value="">전체 사천왕</option>
        <option value="지국천왕">지국천왕</option>
        <option value="다문천왕">다문천왕</option>
        <option value="광목천왕">광목천왕</option>
        <option value="증장천왕">증장천왕</option>
        <option value="보유 없음">보유 없음</option>
      </select>
      <select id="completeFilter" onchange="render()">
        <option value="">전체 완료 여부</option>
        <option value="2nd">2차 완료</option>
        <option value="awaken">각성 완료</option>
      </select>
    </div>
  </div>

  <div class="section-title">👑 임원진 (<span id="execTitle">0</span>명)</div>
  <div id="executives" class="executives"></div>

  <div class="section-title">📋 상단 명단</div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>직책</th><th>본캐 닉네임</th><th>부캐릭터</th><th>사천왕</th>
          <th>2차 완료</th><th>각성 완료</th><th>비고</th><th>관리</th>
        </tr>
      </thead>
      <tbody id="memberList"></tbody>
    </table>
  </div>

  <div class="admin-panel" id="adminPanel">
    <div class="admin-title">🛠 상단원 정보 관리 <span id="modeText">(등록 모드)</span></div>
    <div class="form-grid">
      <select id="position">
        <option value="상단명단">일반 상단원</option>
        <option value="임원진">임원진</option>
      </select>
      <input id="name" placeholder="본캐 닉네임">
      <input id="subs" placeholder="부캐릭터 (쉼표로 구분)">
      <select id="king">
        <option value="보유 없음">보유 없음</option>
        <option value="지국천왕">지국천왕</option>
        <option value="다문천왕">다문천왕</option>
        <option value="광목천왕">광목천왕</option>
        <option value="증장천왕">증장천왕</option>
      </select>
      <input id="duty" placeholder="직책">
      <input id="note" placeholder="비고">
    </div>
    <div class="check-area">
      <label><input type="checkbox" id="is2nd"> 2차 완료</label>
      <label><input type="checkbox" id="isAwaken"> 각성 완료</label>
    </div>
    <div class="admin-actions">
      <button class="admin-btn add-btn" onclick="newMember()">➕ 등록 모드</button>
      <button class="admin-btn save-btn" onclick="saveMember()">💾 저장</button>
      <button class="admin-btn cancel-btn" onclick="clearForm()">취소</button>
      <button class="admin-btn backup-btn" onclick="downloadBackup()">📥 명단 백업</button>
      <label class="restore-label">📤 백업 복원<input id="restoreFile" type="file" accept=".json" hidden onchange="restoreBackup(event)"></label>
    </div>
    <div class="status" id="saveStatus"></div>
  </div>
</div>

<footer>© 2026 大韓民國 상단 | 현무서버 All rights reserved.</footer>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbyj3TC79wglpRc2XgVUXdtHYm6cUFTeOB3AJ2dDo1FDxDRsXgD_EAcOVDqF1KVAysZLkA/exec";
const ADMIN_PASSWORD="1357";
let members=[];
let editId=null;
let adminMode=false;

window.addEventListener("load",loadMembers);

async function loadMembers(){
  setStatus("명단을 불러오는 중...");
  try{
    const res=await fetch(API_URL+"?t="+Date.now(),{cache:"no-store"});
    const data=await res.json();
    
    // --- [수정된 부분] ---
    // 구글 시트에서 가져온 데이터 중, 본캐 닉네임(name)이 비어있는 행은
    // 더미 데이터로 간주하고 필터링하여 제외합니다.
    members = Array.isArray(data) 
      ? data.filter(m => m && typeof m === 'object' && String(m.name || "").trim() !== "").map(normalizeMember) 
      : [];
    // -------------------

    render();
    setStatus("Google Sheet 연결 완료");
  }catch(e){
    console.error(e);
    setStatus("Google Sheet 연결 실패");
    alert("Google Sheet에서 명단을 불러오지 못했습니다.\nApps Script 배포 상태를 확인해주세요.");
  }
}

function normalizeMember(m){
  return {
    id:m.id||createId(),
    name:String(m.name||"").trim(),
    subs:String(m.subs||"").trim(),
    note:String(m.note||"
