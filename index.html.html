<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大韓民國 상단 - 현무서버</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f3ff;color:#222;font-family:"Noto Sans KR","Malgun Gothic",sans-serif}
button,input,select{font-family:inherit}
.header{position:relative;width:100%;overflow:hidden;background:#eef4ff}
.header img{display:block;width:100%;height:auto;max-height:390px;object-fit:cover;object-position:center top}
.admin-login{position:absolute;left:50%;top:78%;transform:translateX(-50%);z-index:20;border:0;border-radius:30px;padding:12px 25px;background:#d99b16;color:#fff;font-size:15px;font-weight:900;box-shadow:0 5px 14px rgba(0,0,0,.2);cursor:pointer;white-space:nowrap}
.admin-login:hover{transform:translateX(-50%) translateY(-2px)}
.container{width:min(1400px,94%);margin:22px auto 45px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.stat{background:#fff;border-radius:20px;padding:18px;text-align:center;box-shadow:0 5px 18px rgba(80,50,120,.08)}
.stat-title{color:#888;font-size:14px}.stat-number{margin-top:5px;font-size:30px;font-weight:900;color:#7250a4}
.search-box{background:#fff;border-radius:20px;padding:16px;margin-bottom:22px;box-shadow:0 5px 18px rgba(80,50,120,.08)}
.search-row{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:10px}
.search-row input,.search-row select,.form-grid input,.form-grid select{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;background:#fff;outline:none}
.search-row input:focus,.search-row select:focus,.form-grid input:focus,.form-grid select:focus{border-color:#9871c7}
.section-title{margin:25px 0 12px;padding-bottom:8px;border-bottom:1px solid #ddd;font-size:22px;font-weight:900;color:#614495}
.executives{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.exec-card{background:#fff;border-radius:15px;padding:15px 10px;min-height:85px;text-align:center;box-shadow:0 5px 15px rgba(80,50,120,.08);transition:.2s}
.exec-card:hover{transform:translateY(-3px)}
.exec-name{font-size:17px;font-weight:900;color:#5e4287}.exec-duty{margin-top:5px;font-size:13px;color:#777}
.table-wrap{width:100%;overflow-x:auto;background:#fff;border-radius:12px;box-shadow:0 5px 18px rgba(80,50,120,.08)}
table{width:100%;min-width:1100px;border-collapse:collapse}
thead th{padding:12px 8px;background:linear-gradient(#b17d18,#96640a);color:#fff;font-size:14px;white-space:nowrap}
tbody td{padding:10px 8px;text-align:center;border-bottom:1px solid #eee;font-size:13px}
tbody tr:hover td{background:#fcfaff}.main-name{font-weight:900;color:#4d3a69}
.king-badge{display:inline-block;min-width:82px;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:900;background:#fff}
.king-jiguk{color:#9148c7;border:2px solid #b86be8;background:#fbf3ff}
.king-damun{color:#2474c7;border:2px solid #67a9ed;background:#f1f8ff}
.king-gwangmok{color:#299452;border:2px solid #70c889;background:#f1fff5}
.king-jeungjang{color:#e78a17;border:2px solid #f0a746;background:#fff8ed}
.king-none{color:#888;border:2px solid #ccc;background:#f7f7f7}
.complete{color:#098331;font-size:18px;font-weight:900}.incomplete{color:#aaa;font-size:15px}
.manage-btn{border:0;border-radius:6px;padding:6px 10px;margin:1px;color:#fff;cursor:pointer;font-size:12px;font-weight:700}
.edit-btn{background:#1769c2}.delete-btn{background:#e33434}.manage-btn:hover{opacity:.8}
.admin-panel{display:none;margin-top:18px;background:linear-gradient(135deg,#fffdf7,#fff8ea);border:1px solid #e5d3ad;border-radius:12px;padding:18px;box-shadow:0 5px 18px rgba(80,50,120,.08)}
.admin-panel.active{display:block}
.admin-title{font-size:19px;font-weight:900;color:#62471f;margin-bottom:15px}
.form-grid{display:grid;grid-template-columns:1fr 1.4fr 1.4fr 1fr 1fr 1.4fr;gap:9px}
.check-area{display:flex;gap:25px;margin:12px 0}.check-area label{font-size:14px;font-weight:700}
.admin-actions{display:flex;gap:8px;flex-wrap:wrap}
.admin-btn{border:0;border-radius:8px;padding:10px 17px;cursor:pointer;font-weight:800}
.add-btn{background:#c28b12;color:#fff}.save-btn{background:#208342;color:#fff}.cancel-btn{background:#999;color:#fff}.backup-btn{background:#3377ae;color:#fff}.restore-label{background:#6d55a5;color:#fff;border-radius:8px;padding:10px 17px;cursor:pointer;font-weight:800}
.status{text-align:center;color:#777;font-size:12px;margin:10px 0}
.status.ok{color:#208342}.status.err{color:#c33;font-weight:700}
.sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#bbb;margin-right:5px}.sync-dot.ok{background:#208342}.sync-dot.err{background:#d33}
.empty{padding:35px;text-align:center;color:#999}
.loading{padding:35px;text-align:center;color:#777}
footer{text-align:center;color:#888;font-size:12px;padding:20px}
@media(max-width:1100px){.executives{grid-template-columns:repeat(3,1fr)}}
@media(max-width:800px){
 .stats{grid-template-columns:1fr}.search-row{grid-template-columns:1fr}.executives{grid-template-columns:repeat(2,1fr)}
 .form-grid{grid-template-columns:1fr}.header img{max-height:none}
 .admin-login{top:76%;padding:10px 18px;font-size:13px}
}
@media(max-width:450px){.executives{grid-template-columns:1fr 1fr}}

.music-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border-radius:14px;padding:10px 14px;margin-bottom:18px;box-shadow:0 4px 14px rgba(80,50,120,.08)}
.music-info{font-size:13px;font-weight:800;color:#5e4287}.music-controls{display:flex;gap:7px;flex-wrap:wrap}.m-btn{border:0;border-radius:8px;padding:8px 12px;background:#6d55a5;color:#fff;cursor:pointer;font-size:12px;font-weight:800}.m-btn:hover{opacity:.9}
@media(max-width:600px){.music-bar{align-items:flex-start;flex-direction:column}.music-controls{width:100%}.m-btn{flex:1}}
</style>
</head>
<body>

<header class="header">
  <img src="assets/banner.png" alt="大韓民國 상단 현무서버">
  <button class="admin-login" id="adminLoginBtn" onclick="adminLogin(event)">⚙ 관리자 인증 모드</button>

  <div class="music-bar">
    <div class="music-info"><span>🎵 BGM: 조선힙합 - 너의 차선</span></div>
    <div class="music-controls">
      <button class="m-btn" id="playBtn" onclick="togglePlay()">▶ 재생하기</button>
      <button class="m-btn" id="muteBtn" onclick="toggleMute()">🔇 음소거 해제</button>
      <button class="m-btn" onclick="restartSong()">🔄 처음부터</button>
    </div>
    <div id="youtube-player" style="width:1px;height:1px;overflow:hidden;position:absolute;left:-9999px;top:-9999px"></div>
  </div>
</header>

<div class="container">

  <div class="stats">
    <div class="stat"><div class="stat-title">전체 인원</div><div class="stat-number" id="totalCount">—</div></div>
    <div class="stat"><div class="stat-title">임원진</div><div class="stat-number" id="execCount">—</div></div>
    <div class="stat"><div class="stat-title">일반 상단원</div><div class="stat-number" id="normalCount">—</div></div>
  </div>

  <div class="search-box">
    <div class="search-row">
      <input id="search" type="text" placeholder="🔎 닉네임 / 부캐릭터 검색..." oninput="render()">
      <select id="positionFilter" onchange="render()">
        <option value="">전체 직책</option>
        <option value="임원진">임원진</option>
        <option value="상단명단">일반 상단원</option>
      </select>
      <select id="kingFilter" onchange="render()">
        <option value="">전체 사천왕</option>
        <option value="지국천왕">지국천왕</option>
        <option value="다문천왕">다문천왕</option>
        <option value="광목천왕">광목천왕</option>
        <option value="증장천왕">증장천왕</option>
        <option value="보유 없음">보유 없음</option>
      </select>
      <select id="completeFilter" onchange="render()">
        <option value="">전체 완료 여부</option>
        <option value="2nd">2차 완료</option>
        <option value="awaken">각성 완료</option>
      </select>
    </div>
  </div>

  <div class="section-title">👑 임원진 (<span id="execTitle">—</span>명)</div>
  <div id="executives" class="executives"><div class="loading">명단을 불러오는 중...</div></div>

  <div class="section-title">📋 상단 명단</div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>직책</th><th>본캐 닉네임</th><th>부캐릭터</th><th>사천왕</th>
          <th>2차 완료</th><th>각성 완료</th><th>비고</th><th>관리</th>
        </tr>
      </thead>
      <tbody id="memberList"><tr><td colspan="8" class="loading">명단을 불러오는 중...</td></tr></tbody>
    </table>
  </div>

  <div class="admin-panel" id="adminPanel">
    <div class="admin-title">🛠 상단원 정보 관리 <span id="modeText">(등록 모드)</span></div>

    <div class="form-grid">
      <select id="position">
        <option value="상단명단">일반 상단원</option>
        <option value="임원진">임원진</option>
      </select>
      <input id="name" placeholder="본캐 닉네임">
      <input id="subs" placeholder="부캐릭터 (쉼표로 구분)">
      <select id="king">
        <option value="보유 없음">보유 없음</option>
        <option value="지국천왕">지국천왕</option>
        <option value="다문천왕">다문천왕</option>
        <option value="광목천왕">광목천왕</option>
        <option value="증장천왕">증장천왕</option>
      </select>
      <input id="duty" placeholder="직책">
      <input id="note" placeholder="비고">
    </div>

    <div class="check-area">
      <label><input type="checkbox" id="is2nd"> 2차 완료</label>
      <label><input type="checkbox" id="isAwaken"> 각성 완료</label>
    </div>

    <div class="admin-actions">
      <button class="admin-btn add-btn" onclick="newMember()">➕ 등록 모드</button>
      <button class="admin-btn save-btn" onclick="saveMember()">💾 저장</button>
      <button class="admin-btn cancel-btn" onclick="clearForm()">취소</button>
      <button class="admin-btn backup-btn" onclick="downloadBackup()">📥 명단 백업</button>
      <label class="restore-label">📤 백업 복원<input id="restoreFile" type="file" accept=".json" hidden onchange="restoreBackup(event)"></label>
    </div>

    <div class="status" id="saveStatus"><span class="sync-dot"></span>연결 확인 중...</div>
  </div>

  <div class="status" id="connectionStatus"><span class="sync-dot"></span>Google Sheet 연결 확인 중...</div>
</div>

<footer>© 2026 大韓民國 상단 | 현무서버 All rights reserved.</footer>

<script>
/*************************************************
 * GitHub index.html
 * Google Sheet = 유일한 원본
 *************************************************/

/* ★ 사용 중인 Apps Script /exec 주소 */
const API_URL="https://script.google.com/macros/s/AKfycbxRG9nTcv5gOLK_tFshy9ys04-nRSV8EZ6NG8eRv07Zw-cQvKaRvWVSrNVgWMhxY9JchA/exec";

const ADMIN_PASSWORD = "1357";

let members = [];
let editId = null;
let adminMode = false;
let loadedOnce = false;
let loading = false;

/* =========================
 * 시작 / 자동 동기화
 * ========================= */

/* =========================
 * BGM
 * 기존에 사용하던 YouTube 곡을 그대로 사용합니다.
 * 영상 ID: PxmKaXqeK2s
 * YouTube API는 홈페이지 표시를 늦추지 않도록 비동기로 로드합니다.
 * ========================= */
let player = null;
let isMuted = true;
let ytLoaded = false;

function loadYouTubeApi(){
  if(ytLoaded || window.YT) { initYouTubePlayer(); return; }
  ytLoaded = true;
  const tag=document.createElement('script');
  tag.src='https://www.youtube.com/iframe_api';
  tag.async=true;
  document.head.appendChild(tag);
}

function onYouTubeIframeAPIReady(){ initYouTubePlayer(); }
window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

function initYouTubePlayer(){
  if(player || !window.YT || !YT.Player) return;
  try{
    player=new YT.Player('youtube-player',{
      height:'1', width:'1', videoId:'PxmKaXqeK2s',
      playerVars:{autoplay:1,loop:1,playlist:'PxmKaXqeK2s',mute:1,controls:0,playsinline:1},
      events:{
        onReady:function(e){ e.target.mute(); e.target.setVolume(80); e.target.playVideo(); },
        onStateChange:function(e){ if(e.data===YT.PlayerState.ENDED) e.target.playVideo(); }
      }
    });
  }catch(e){}
}

function togglePlay(){
  if(!player || !window.YT) return;
  const state=player.getPlayerState();
  const btn=document.getElementById('playBtn');
  if(state===YT.PlayerState.PLAYING){ player.pauseVideo(); if(btn)btn.textContent='▶ 재생하기'; }
  else { player.playVideo(); if(btn)btn.textContent='⏸ 일시정지'; }
}

function toggleMute(){
  if(!player) return;
  const btn=document.getElementById('muteBtn');
  if(isMuted){ player.unMute(); player.setVolume(80); isMuted=false; if(btn)btn.textContent='🔊 소리 끄기'; }
  else { player.mute(); isMuted=true; if(btn)btn.textContent='🔇 음소거 해제'; }
}

function restartSong(){
  if(!player) return;
  player.seekTo(0,true); player.playVideo();
}

window.addEventListener("load", function(){
  loadMembers(true);
  setTimeout(loadYouTubeApi, 800);
  setInterval(function(){
    if(document.visibilityState === "visible" && !loading) loadMembers(false);
  }, 5000);
});

document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "visible" && !loading) loadMembers(false);
});

window.addEventListener("focus", function(){
  if(!loading) loadMembers(false);
});

/* =========================
 * 서버 GET
 * ========================= */
async function loadMembers(initial){
  if(loading) return;
  loading = true;

  if(initial) setConnection("Google Sheet에서 명단을 불러오는 중...", "normal");
  else setConnection("최신 명단 동기화 중...", "normal");

  try{
    let data = await fetchJson();

    if(!data || data.result !== "success" || !Array.isArray(data.members)){
      throw new Error((data && data.message) || "서버 응답 형식이 올바르지 않습니다.");
    }

    members = sanitizeServerMembers(data.members);
    loadedOnce = true;

    render();
    setConnection("Google Sheet 연결 완료 · " + formatTime(data.serverTime), "ok");
    setStatus("✓ 최신 명단 반영 완료");
  }catch(err){
    console.error(err);

    // 실패했다고 members를 []로 만들지 않음
    // 이미 정상 로드된 명단이 있다면 그대로 유지
    if(!loadedOnce){
      renderOffline();
    }

    setConnection("Google Sheet 연결 실패 · " + (err.message || "배포/권한 확인 필요"), "err");
    setStatus("연결 실패");
  }finally{
    loading = false;
  }
}

async function fetchJson(){
  const url = API_URL + "?t=" + Date.now();

  // 1차: 일반 fetch
  try{
    const res = await fetch(url, {
      method: "GET",
      cache: "no-store",
      redirect: "follow"
    });

    if(!res.ok) throw new Error("HTTP " + res.status);

    const text = await res.text();
    if(!text) throw new Error("빈 응답");

    return JSON.parse(text);
  }catch(fetchError){
    console.warn("일반 GET 실패:", fetchError);
  }

  // 2차: JSONP fallback
  return await fetchJsonp();
}

function fetchJsonp(){
  return new Promise(function(resolve, reject){
    const callbackName = "__roster_callback_" + Date.now() + "_" + Math.floor(Math.random()*100000);
    const script = document.createElement("script");
    const timeout = setTimeout(function(){
      cleanup();
      reject(new Error("Apps Script 응답 시간이 초과되었습니다."));
    }, 12000);

    function cleanup(){
      clearTimeout(timeout);
      try{ delete window[callbackName]; }catch(_){}
      if(script.parentNode) script.parentNode.removeChild(script);
    }

    window[callbackName] = function(data){
      cleanup();
      resolve(data);
    };

    script.onerror = function(){
      cleanup();
      reject(new Error("Apps Script에 접속할 수 없습니다."));
    };

    script.src = API_URL +
      "?callback=" + encodeURIComponent(callbackName) +
      "&t=" + Date.now();

    document.body.appendChild(script);
  });
}

/* =========================
 * 데이터 정리
 * ========================= */
function sanitizeServerMembers(list){
  const result = [];
  const ids = new Set();

  (Array.isArray(list) ? list : []).forEach(function(m){
    if(!m) return;

    const name = String(m.name || "").trim();
    if(!name) return;

    const id = String(m.id || "").trim();

    // 같은 ID만 중복 제거합니다.
    // 같은 이름이 이미 Sheet에 존재하더라도 실제 Sheet 행 수와
    // 화면 인원수가 어긋나지 않도록 임의로 제외하지 않습니다.
    if(id && ids.has(id)) return;

    const member = {
      id: id,
      name: name,
      subs: String(m.subs || "").trim(),
      note: String(m.note || "").trim(),
      duty: String(m.duty || "").trim(),
      king: String(m.king || "보유 없음").trim() || "보유 없음",
      position: m.position === "임원진" ? "임원진" : "상단명단",
      is2nd: toBoolean(m.is2nd),
      isAwaken: toBoolean(m.isAwaken)
    };

    result.push(member);
    if(id) ids.add(id);
  });

  return result;
}

function toBoolean(v){
  return v === true ||
    v === 1 ||
    v === "1" ||
    String(v).toUpperCase() === "TRUE" ||
    String(v).toUpperCase() === "YES" ||
    String(v).toUpperCase() === "Y" ||
    String(v).toUpperCase() === "ON" ||
    String(v).toUpperCase() === "O" ||
    v === "완료";
}

/* =========================
 * 화면
 * ========================= */
function render(){
  const validMembers = members.filter(function(m){
    return String(m.name || "").trim() !== "";
  });

  const executives = validMembers.filter(function(m){
    return m.position === "임원진";
  });

  const normal = validMembers.filter(function(m){
    return m.position !== "임원진";
  });

  document.getElementById("totalCount").textContent = validMembers.length;
  document.getElementById("execCount").textContent = executives.length;
  document.getElementById("normalCount").textContent = normal.length;
  document.getElementById("execTitle").textContent = executives.length;

  document.getElementById("executives").innerHTML =
    executives.length
      ? executives.map(function(m){
          return `
            <div class="exec-card">
              <div class="exec-name">👑 ${escapeHTML(m.name)}</div>
              <div class="exec-duty">${escapeHTML(m.duty || "임원진")}</div>
            </div>
          `;
        }).join("")
      : '<div class="empty">등록된 임원진이 없습니다.</div>';

  const search = document.getElementById("search").value.trim().toLowerCase();
  const position = document.getElementById("positionFilter").value;
  const king = document.getElementById("kingFilter").value;
  const complete = document.getElementById("completeFilter").value;

  const filtered = validMembers.filter(function(m){
    const text = (
      m.name + " " +
      m.subs + " " +
      m.duty + " " +
      m.note
    ).toLowerCase();

    if(search && !text.includes(search)) return false;
    if(position && m.position !== position) return false;
    if(king && m.king !== king) return false;
    if(complete === "2nd" && !m.is2nd) return false;
    if(complete === "awaken" && !m.isAwaken) return false;

    return true;
  });

  document.getElementById("memberList").innerHTML =
    filtered.length
      ? filtered.map(function(m){
          return `
            <tr>
              <td>${escapeHTML(m.duty || "-")}</td>
              <td class="main-name">${escapeHTML(m.name)}</td>
              <td>${escapeHTML(m.subs || "-")}</td>
              <td>
                <span class="king-badge ${kingClass(m.king)}">
                  ${escapeHTML(m.king || "보유 없음")}
                </span>
              </td>
              <td>${m.is2nd ? '<span class="complete">✓</span>' : '<span class="incomplete">-</span>'}</td>
              <td>${m.isAwaken ? '<span class="complete">✓</span>' : '<span class="incomplete">-</span>'}</td>
              <td>${escapeHTML(m.note || "-")}</td>
              <td>
                ${adminMode
                  ? `
                    <button class="manage-btn edit-btn" onclick="editMember('${escapeJS(m.id)}')">수정</button>
                    <button class="manage-btn delete-btn" onclick="deleteMember('${escapeJS(m.id)}')">삭제</button>
                  `
                  : "-"
                }
              </td>
            </tr>
          `;
        }).join("")
      : '<tr><td colspan="8" class="empty">검색 결과가 없습니다.</td></tr>';
}

/* =========================
 * 관리자
 * ========================= */
function adminLogin(e){
  if(e) e.stopPropagation();

  if(adminMode){
    adminMode = false;
    document.getElementById("adminPanel").classList.remove("active");
    document.getElementById("adminLoginBtn").textContent = "⚙ 관리자 인증 모드";
    clearForm();
    render();
    return;
  }

  const pw = prompt("관리자 비밀번호를 입력하세요.");

  if(pw === ADMIN_PASSWORD){
    adminMode = true;
    document.getElementById("adminPanel").classList.add("active");
    document.getElementById("adminLoginBtn").textContent = "🔓 관리자 모드 종료";
    document.getElementById("adminPanel").scrollIntoView({behavior:"smooth", block:"start"});
    render();
    alert("관리자 인증 완료!");
  }else if(pw !== null){
    alert("비밀번호가 틀렸습니다.");
  }
}

function newMember(){
  if(!adminMode){
    alert("먼저 관리자 인증을 해주세요.");
    return;
  }

  editId = null;
  clearForm();
  document.getElementById("adminPanel").classList.add("active");
  document.getElementById("modeText").textContent = "(등록 모드)";
  document.getElementById("name").focus();
}

function editMember(id){
  if(!adminMode){
    alert("관리자 인증이 필요합니다.");
    return;
  }

  const m = members.find(function(x){
    return String(x.id) === String(id);
  });

  if(!m){
    alert("회원을 찾을 수 없습니다.\n최신 명단을 다시 불러옵니다.");
    loadMembers(false);
    return;
  }

  editId = m.id;

  document.getElementById("position").value = m.position;
  document.getElementById("name").value = m.name;
  document.getElementById("subs").value = m.subs;
  document.getElementById("king").value = m.king;
  document.getElementById("duty").value = m.duty;
  document.getElementById("note").value = m.note;
  document.getElementById("is2nd").checked = m.is2nd;
  document.getElementById("isAwaken").checked = m.isAwaken;
  document.getElementById("modeText").textContent = "(수정 모드)";

  document.getElementById("adminPanel").classList.add("active");
  document.getElementById("adminPanel").scrollIntoView({behavior:"smooth", block:"start"});
}

async function saveMember(){
  if(!adminMode){
    alert("먼저 관리자 인증을 해주세요.");
    return;
  }

  const name = document.getElementById("name").value.trim();

  if(!name){
    alert("본캐 닉네임을 입력해주세요.");
    return;
  }

  const duplicate = members.find(function(m){
    return String(m.name || "").trim().toLowerCase() === name.toLowerCase() &&
           String(m.id) !== String(editId || "");
  });

  if(duplicate){
    alert("이미 등록된 본캐 닉네임입니다.\n\n[" + name + "]");
    return;
  }

  const member = {
    id: editId || "",
    name: name,
    subs: document.getElementById("subs").value.trim(),
    note: document.getElementById("note").value.trim(),
    duty: document.getElementById("duty").value.trim(),
    king: document.getElementById("king").value,
    position: document.getElementById("position").value,
    is2nd: document.getElementById("is2nd").checked,
    isAwaken: document.getElementById("isAwaken").checked
  };

  setStatus(editId ? "수정 저장 중..." : "등록 저장 중...");

  try{
    // ★ 전체 members 배열을 보내지 않습니다.
    // 서버가 현재 Google Sheet를 다시 읽고 1건만 처리합니다.
    const result = await postAction(
      editId ? "update" : "add",
      editId ? {member:member} : {member:member}
    );

    applyServerResult(result);

    editId = null;
    clearForm();
    render();
    setStatus("✓ Google Sheet에 즉시 반영됨");
  }catch(err){
    console.error(err);
    setStatus("저장 실패");

    // 저장 실패 시 화면의 명단은 건드리지 않고 상태만 표시
    loadMembers(false);
  }
}

async function deleteMember(id){
  if(!adminMode){
    alert("관리자 인증이 필요합니다.");
    return;
  }

  const m = members.find(function(x){
    return String(x.id) === String(id);
  });

  if(!m) return;

  if(!confirm("[" + m.name + "] 회원을 정말 삭제하시겠습니까?")) return;

  setStatus("삭제 저장 중...");

  try{
    const result = await postAction("delete", {id:id});
    applyServerResult(result);

    render();
    setStatus("✓ 삭제 내용이 즉시 반영됨");
  }catch(err){
    console.error(err);
    setStatus("삭제 실패 · 최신 명단 다시 확인 중...");
    loadMembers(false);
  }
}

/* =========================
 * 서버 POST
 * ========================= */
async function postAction(action, payload){
  const body = Object.assign({action:action}, payload || {});

  const res = await fetch(API_URL + "?t=" + Date.now(), {
    method:"POST",
    headers:{
      "Content-Type":"text/plain;charset=utf-8"
    },
    body:JSON.stringify(body),
    cache:"no-store",
    redirect:"follow"
  });

  const text = await res.text();

  if(!res.ok){
    throw new Error("HTTP " + res.status);
  }

  let result;
  try{
    result = JSON.parse(text);
  }catch(e){
    throw new Error("Apps Script가 JSON 응답을 반환하지 않았습니다.");
  }

  if(!result || result.result !== "success"){
    throw new Error((result && result.message) || "서버 저장 실패");
  }

  return result;
}

function applyServerResult(result){
  if(!result || result.result !== "success") throw new Error("서버 저장 실패");
  if(Array.isArray(result.members)){
    members = sanitizeServerMembers(result.members);
    loadedOnce = true;
    return;
  }
  if(result.action === "add" && result.saved){
    members.push(normalizeMember(result.saved));
  }else if(result.action === "update" && result.saved){
    const i=members.findIndex(m=>String(m.id)===String(result.saved.id));
    if(i>=0) members[i]=normalizeMember(result.saved);
  }else if(result.action === "delete" && result.saved){
    members=members.filter(m=>String(m.id)!==String(result.saved.id));
  }
  loadedOnce=true;
}

/* =========================
 * 백업 / 복원
 * ========================= */
function downloadBackup(){
  if(!loadedOnce){
    alert("Google Sheet와 연결된 후 백업할 수 있습니다.");
    return;
  }

  const backup = {
    version:1,
    exportedAt:new Date().toISOString(),
    members:members
  };

  const blob = new Blob(
    [JSON.stringify(backup, null, 2)],
    {type:"application/json;charset=utf-8"}
  );

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download =
    "대한민국상단_명단백업_" +
    new Date().toISOString().slice(0,10) +
    ".json";

  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);

  setStatus("명단 백업 파일 생성 완료");
}

function restoreBackup(e){
  const file = e.target.files[0];
  if(!file) return;

  const reader = new FileReader();

  reader.onload = async function(){
    try{
      const parsed = JSON.parse(reader.result);

      let data;

      // 새 백업 형식
      if(parsed && Array.isArray(parsed.members)){
        data = parsed.members;
      }
      // 예전 백업 형식
      else if(Array.isArray(parsed)){
        data = parsed;
      }
      else{
        throw new Error("백업 파일 형식이 올바르지 않습니다.");
      }

      data = sanitizeServerMembers(data);

      if(!confirm(
        "백업 파일의 " + data.length + "명을\n" +
        "현재 Google Sheet 명단으로 복원하시겠습니까?\n\n" +
        "복원 전에 현재 명단은 서버 자동 백업됩니다."
      )){
        return;
      }

      setStatus("백업 복원 중...");

      const result = await postAction("restore", {members:data});
      applyServerResult(result);

      render();
      setStatus("백업 복원 완료");
      
    }catch(err){
      console.error(err);
      setStatus("백업 복원 실패");
      alert("백업 복원 실패\n\n" + (err.message || "알 수 없는 오류"));
    }finally{
      e.target.value = "";
    }
  };

  reader.readAsText(file, "utf-8");
}

/* =========================
 * 상태 / 유틸
 * ========================= */
function setConnection(text, type){
  const el = document.getElementById("connectionStatus");
  if(!el) return;

  el.className = "status " + (type === "ok" ? "ok" : type === "err" ? "err" : "");
  el.innerHTML =
    '<span class="sync-dot ' +
    (type === "ok" ? "ok" : type === "err" ? "err" : "") +
    '"></span>' +
    escapeHTML(text);
}

function setStatus(text){
  const el = document.getElementById("saveStatus");
  if(el){
    el.innerHTML = '<span class="sync-dot"></span>' + escapeHTML(text);
  }
}

function formatTime(ms){
  if(!ms) return "";

  const d = new Date(Number(ms));

  if(isNaN(d.getTime())) return "";

  return d.toLocaleTimeString("ko-KR", {
    hour:"2-digit",
    minute:"2-digit",
    second:"2-digit"
  });
}

function escapeHTML(v){
  return String(v ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function escapeJS(v){
  return String(v ?? "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'")
    .replace(/\r/g,"\\r")
    .replace(/\n/g,"\\n");
}
