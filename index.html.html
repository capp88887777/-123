<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大韓民國 상단 - 현무서버</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Malgun Gothic', sans-serif; padding: 0; margin: 0; background-color: #ffffff; color: #333; }
        .header { background: linear-gradient(180deg, #444 0%, #222 100%); text-align: center; padding: 40px 20px; color: white; }
        .title-main { font-size: 34px; font-weight: bold; margin-bottom: 5px; letter-spacing: 1px; }
        .server-tag { background: #b8860b; color: #fff; padding: 3px 15px; border-radius: 15px; font-size: 14px; display: inline-block; margin-bottom: 5px; font-weight: bold; }
        .title-sub { font-size: 22px; font-weight: bold; color: #eee; }
        .admin-btn-container { margin-top: 15px; text-align: center; }
        .admin-btn { background: #b8860b; color: #fff; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .content { max-width: 800px; margin: 3px auto; padding: 20px; }
        .search-box { display: flex; gap: 10px; margin: 5px 0 20px 0; }
        .search-input { flex-grow: 1; padding: 10px 15px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; outline: none; background: #fafafa; }
        .search-select { padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; outline: none; background: #fafafa; }
        .section-title { font-size: 18px; font-weight: bold; color: #b8860b; margin-top: 30px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .member-count { font-size: 15px; color: #777; font-weight: bold; margin-left: 4px; }
        .pw-box { display: none; background: #fff; border: 2px solid #b8860b; padding: 15px; text-align: center; max-width: 300px; margin: 15px auto; border-radius: 6px; }
        .pw-box input { padding: 8px; border: 1px solid #ccc; width: 120px; border-radius: 4px; }
        .pw-box button { background: #111; color: white; border: none; padding: 8px 14px; border-radius: 4px; cursor: pointer; }
        .admin-panel { display: none; background: #f9f9f9; border: 2px solid #b8860b; padding: 20px; margin-top: 15px; border-radius: 6px; }
        .form-row { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
        .form-row input, .form-row select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        .btn-submit { background: #b8860b; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-cancel { background: #666; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; display: none; }
        .btn-download { background: #2e7d32; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; margin-left: auto; }
        .member-list { list-style: none; padding: 0; margin: 0; }
        .member-item { display: flex; align-items: center; padding: 15px 10px; border-bottom: 1px solid #eee; }
        .tag-box { display: flex; flex-direction: column; gap: 4px; width: 80px; margin-right: 15px; flex-shrink: 0; }
        .status-tag { border: 1px solid #d4c4a8; background-color: #faf7f2; color: #705e43; font-size: 11px; padding: 3px 0; border-radius: 2px; text-align: center; font-weight: bold; }
        .status-tag.empty { border: 1px dashed #eee; background-color: transparent; color: #ccc; }
        .info-box { flex-grow: 1; min-width: 0; }
        .name-line { font-size: 18px; font-weight: bold; color: #222; }
        .name-line span { font-size: 16px; font-weight: normal; color: #555; }
        .detail-line { font-size: 13px; color: #777; }
        .admin-actions { display: flex; gap: 5px; margin-left: 10px; }
        .btn-edit { background: #007bff; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .btn-delete { background: #ff4d4d; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .guide-text { text-align: center; color: #888; padding: 25px; font-size: 14px; background: #fafafa; border-radius: 6px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="header">
    <div class="title-main">大韓民國 상단</div>
    <div class="server-tag">현무서버</div>
    <div class="title-sub">大韓民國 상단 사천왕 보유 현황</div>
    <div class="admin-btn-container">
        <button class="admin-btn" id="loginBtn" type="button">⚙️ 관리자 인증 모드</button>
    </div>
</div>

<div class="content">
    <div class="search-box">
        <select id="searchKing" class="search-select">
            <option value="">사천왕을 선택해주세요</option>
            <option value="지국천왕">지국천왕</option>
            <option value="다문천왕">다문천왕</option>
            <option value="광목천왕">광목천왕</option>
            <option value="증장천왕">증장천왕</option>
            <option value="보유 없음">보유 없음</option>
        </select>
        <input type="text" id="searchInput" class="search-input" placeholder="명단 검색 (닉네임/직책 등)..." autocomplete="off">
    </div>

    <div id="pwBox" class="pw-box">
        <p>비밀번호를 입력하세요</p>
        <input type="password" id="adminPw" placeholder="암호 입력">
        <button type="button" id="pwSubmitBtn">확인</button>
    </div>

    <div id="adminPanel" class="admin-panel">
        <h3 id="panelTitle">🛠️ 상단원 정보 관리 (등록 모드)</h3>
        <input type="hidden" id="editIndex" value="">
        <div class="form-row">
            <select id="addPosition">
                <option value="임원진">임원진</option>
                <option value="상단명단">일반 상단원</option>
            </select>
            <input type="text" id="addName" placeholder="본캐 닉네임">
            <input type="text" id="addSubs" placeholder="부캐릭터">
            <input type="text" id="addDuty" placeholder="직책">
            <select id="addKing">
                <option value="지국천왕">지국천왕</option>
                <option value="다문천왕">다문천왕</option>
                <option value="광목천왕">광목천왕</option>
                <option value="증장천왕">증장천왕</option>
                <option value="보유 없음">보유 없음</option>
            </select>
        </div>
        <div class="form-row">
            <label><input type="checkbox" id="check2nd"> 2차 완료</label>
            <label><input type="checkbox" id="checkAwaken"> 각성 완료</label>
            <button class="btn-submit" id="submitBtn" type="button">등록하기</button>
            <button class="btn-cancel" id="cancelBtn" type="button">취소</button>
            <button class="btn-download" id="downloadBtn" type="button">📥 명단 엑셀 다운로드</button>
        </div>
    </div>

    <div class="section-title">01 임원진 <span class="member-count" id="executiveCount">(00)</span></div>
    <ul id="executiveList" class="member-list"></ul>

    <div class="section-title">02 상단명단 <span class="member-count" id="regularCount">(00)</span></div>
    <ul id="regularList" class="member-list"></ul>
</div>

<script>
    var GAS_URL = "https://script.google.com/macros/s/AKfycbwzsB95cqaItlBdS8mj79DZL1uCDgLwto7olWEkv3XLCGiaC-s5mxzM7gC03EOe4twDtA/exec";
    var members = [];

    function loadMemberData() {
        fetch(GAS_URL)
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (Array.isArray(data)) {
                    members = data;
                    renderLists();
                }
            })
            .catch(function(err) { console.error(err); });
    }

    function saveMemberData() {
        fetch(GAS_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(members)
        })
        .catch(function(err) { console.error(err); });
    }

    function isAdminLoggedIn() {
        return sessionStorage.getItem('is_admin') === 'true';
    }

    function renderLists() {
        var execContainer = document.getElementById('executiveList');
        var regContainer = document.getElementById('regularList');
        execContainer.innerHTML = '';
        regContainer.innerHTML = '';

        var keyword = (document.getElementById('searchInput').value || '').trim().toLowerCase();
        var selectedKing = document.getElementById('searchKing').value;

        // 사천왕을 선택하거나 검색어를 입력해야만 명단 표시
        if (!selectedKing && !keyword) {
            execContainer.innerHTML = '<div class="guide-text">천왕을 선택하거나 검색어를 입력하면 상단원 명단이 표시됩니다.</div>';
            regContainer.innerHTML = '<div class="guide-text">천왕을 선택하거나 검색어를 입력하면 상단원 명단이 표시됩니다.</div>';
            document.getElementById('executiveCount').innerText = '(00)';
            document.getElementById('regularCount').innerText = '(00)';
            return;
        }

        var execCount = 0, regCount = 0;

        members.forEach(function(member, index) {
            if (selectedKing && member.king !== selectedKing) return;

            var text = [member.name, member.subs, member.duty, member.king].join(' ').toLowerCase();
            if (keyword && text.indexOf(keyword) === -1) return;

            var li = document.createElement('li');
            li.className = 'member-item';

            var tag1 = member.is2nd ? '<div class="status-tag">2차 완료</div>' : '<div class="status-tag empty">-</div>';
            var tag2 = member.isAwaken ? '<div class="status-tag">각성 완료</div>' : '<div class="status-tag empty">-</div>';
            
            // 관리자 모드일 때만 수정/삭제 버튼 노출
            var actionBtns = '';
            if (isAdminLoggedIn()) {
                var uniqueId = member.id || index;
                actionBtns = '<div class="admin-actions">' +
                    '<button class="btn-edit" type="button" onclick="editMember(\'' + uniqueId + '\')">수정</button>' +
                    '<button class="btn-delete" type="button" onclick="deleteMember(\'' + uniqueId + '\')">삭제</button>' +
                    '</div>';
            }

            li.innerHTML = '<div class="tag-box">' + tag1 + tag2 + '</div>' +
                '<div class="info-box"><div class="name-line">' + (member.name||'') + ' <span>/' + (member.subs||'없음') + '</span></div>' +
                '<div class="detail-line">' + (member.king||'') + ' ' + (member.duty||'') + '</div></div>' + actionBtns;

            if (member.position === '임원진') {
                execContainer.appendChild(li);
                execCount++;
            } else {
                regContainer.appendChild(li);
                regCount++;
            }
        });

        document.getElementById('executiveCount').innerText = '(' + String(execCount).padStart(2, '0') + ')';
        document.getElementById('regularCount').innerText = '(' + String(regCount).padStart(2, '0') + ')';
    }

    function saveMember() {
        if (!isAdminLoggedIn()) return alert('관리자 인증이 필요합니다.');
        var name = document.getElementById('addName').value.trim();
        if (!name) return alert('닉네임을 입력하세요.');

        var editIdx = document.getElementById('editIndex').value;

        if (editIdx !== '') {
            // 수정 모드
            var target = members.find(function(m) { return String(m.id || members.indexOf(m)) === String(editIdx); });
            if (target) {
                target.name = name;
                target.subs = document.getElementById('addSubs').value.trim();
                target.duty = document.getElementById('addDuty').value.trim();
                target.king = document.getElementById('addKing').value;
                target.position = document.getElementById('addPosition').value;
                target.is2nd = document.getElementById('check2nd').checked;
                target.isAwaken = document.getElementById('checkAwaken').checked;
            }
            alert('수정되었습니다!');
            resetForm();
        } else {
            // 신규 등록 모드
            var newMember = {
                id: 'id_' + new Date().getTime() + '_' + Math.random().toString(36).substr(2, 5),
                name: name,
                subs: document.getElementById('addSubs').value.trim(),
                duty: document.getElementById('addDuty').value.trim(),
                king: document.getElementById('addKing').value,
                position: document.getElementById('addPosition').value,
                is2nd: document.getElementById('check2nd').checked,
                isAwaken: document.getElementById('checkAwaken').checked
            };
            members.push(newMember);
            alert('등록되었습니다!');
            document.getElementById('addName').value = '';
            document.getElementById('addSubs').value = '';
            document.getElementById('addDuty').value = '';
        }

        renderLists();
        saveMemberData();
    }

    function editMember(targetId) {
        var member = members.find(function(m) { return String(m.id || members.indexOf(m)) === String(targetId); });
        if (!member) return;

        document.getElementById('editIndex').value = targetId;
        document.getElementById('addPosition').value = member.position || '상단명단';
        document.getElementById('addName').value = member.name || '';
        document.getElementById('addSubs').value = member.subs || '';
        document.getElementById('addDuty').value = member.duty || '';
        document.getElementById('addKing').value = member.king || '보유 없음';
        document.getElementById('check2nd').checked = !!member.is2nd;
        document.getElementById('checkAwaken').checked = !!member.isAwaken;

        document.getElementById('panelTitle').innerText = '🛠️ 상단원 정보 관리 (수정 모드)';
        document.getElementById('submitBtn').innerText = '수정 완료';
        document.getElementById('cancelBtn').style.display = 'inline-block';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
        document.getElementById('editIndex').value = '';
        document.getElementById('addName').value = '';
        document.getElementById('addSubs').value = '';
        document.getElementById('addDuty').value = '';
        document.getElementById('check2nd').checked = false;
        document.getElementById('checkAwaken').checked = false;
        document.getElementById('panelTitle').innerText = '🛠️ 상단원 정보 관리 (등록 모드)';
        document.getElementById('submitBtn').innerText = '등록하기';
        document.getElementById('cancelBtn').style.display = 'none';
    }

    function deleteMember(targetId) {
        if (confirm("정말 삭제하시겠습니까?")) {
            members = members.filter(function(m) {
                return String(m.id || members.indexOf(m)) !== String(targetId);
            });
            renderLists();
            saveMemberData();
        }
    }

    function downloadExcel() {
        if (members.length === 0) return alert('다운로드할 명단이 없습니다.');
        var csvContent = "\uFEFF구분,본캐닉네임,부캐릭터,직책,사천왕,2차여부,각성여부\n";
        members.forEach(function(m) {
            csvContent += [
                '"' + (m.position || '') + '"',
                '"' + (m.name || '') + '"',
                '"' + (m.subs || '') + '"',
                '"' + (m.duty || '') + '"',
                '"' + (m.king || '') + '"',
                m.is2nd ? 'O' : 'X',
                m.isAwaken ? 'O' : 'X'
            ].join(',') + "\n";
        });
        var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = '大韓民國_상단명단.csv';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    document.addEventListener('DOMContentLoaded', function() {
        loadMemberData();
        
        document.getElementById('loginBtn').addEventListener('click', function() {
            if (isAdminLoggedIn()) {
                // 이미 로그인 상태면 버튼 클릭 시 관리자 모드 종료 (로그아웃 처리)
                sessionStorage.removeItem('is_admin');
                document.getElementById('adminPanel').style.display = 'none';
                document.getElementById('pwBox').style.display = 'none';
                document.getElementById('adminPw').value = '';
                document.getElementById('loginBtn').innerText = '⚙️ 관리자 인증 모드';
                resetForm();
                renderLists();
            } else {
                // 로그아웃 상태면 비밀번호 입력창 토글
                var pwBox = document.getElementById('pwBox');
                pwBox.style.display = pwBox.style.display === 'block' ? 'none' : 'block';
            }
        });

        document.getElementById('pwSubmitBtn').addEventListener('click', function() {
            if (document.getElementById('adminPw').value === '1357') {
                sessionStorage.setItem('is_admin', 'true');
                document.getElementById('pwBox').style.display = 'none';
                document.getElementById('adminPw').value = '';
                document.getElementById('adminPanel').style.display = 'block';
                document.getElementById('loginBtn').innerText = '🔒 관리자 모드 종료';
                renderLists();
            } else {
                alert('비밀번호 오류');
            }
        });

        document.getElementById('submitBtn').addEventListener('click', saveMember);
        document.getElementById('cancelBtn').addEventListener('click', resetForm);
        document.getElementById('downloadBtn').addEventListener('click', downloadExcel);
        document.getElementById('searchInput').addEventListener('input', renderLists);
        document.getElementById('searchKing').addEventListener('change', renderLists);
    });
</script>
</body>
</html>
