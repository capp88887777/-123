<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大韓民國 상단 - 현무서버</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Malgun Gothic', sans-serif;
            padding: 0;
            margin: 0;
            background-color: #ffffff;
            color: #333;
        }

        .header {
            background: linear-gradient(180deg, #444 0%, #222 100%);
            text-align: center;
            padding: 40px 20px;
            color: white;
        }

        .title-main {
            font-size: 34px;
            font-weight: bold;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .server-tag {
            background: #b8860b;
            color: #fff;
            padding: 3px 15px;
            border-radius: 15px;
            font-size: 14px;
            display: inline-block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .title-sub {
            font-size: 22px;
            font-weight: bold;
            color: #eee;
        }

        .admin-btn-container {
            margin-top: 15px;
            text-align: center;
        }

        .admin-btn {
            background: #b8860b;
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .admin-btn:hover {
            background: #d4a017;
        }

        .content {
            max-width: 900px;
            margin: 20px auto;
            padding: 20px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-top: 35px;
            margin-bottom: 15px;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            color: #b8860b;
            margin: 0;
            display: flex;
            align-items: center;
        }

        .member-count {
            font-size: 16px;
            color: #777;
            font-weight: bold;
            margin-left: 6px;
        }

        .search-container {
            display: flex;
            align-items: center;
        }

        .search-box-inline {
            display: flex;
            width: 240px;
        }

        .search-input {
            flex-grow: 1;
            padding: 6px 10px;
            border: 1px solid #d4c4a8;
            border-right: none;
            border-radius: 4px 0 0 4px;
            font-size: 13px;
            outline: none;
            background: #fff;
        }

        .search-input:focus {
            border-color: #b8860b;
        }

        .search-btn {
            background: #111;
            color: white;
            border: 1px solid #111;
            padding: 6px 14px;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }

        .search-btn:hover {
            background: #333;
        }

        .filter-row {
            margin-bottom: 15px;
        }

        .search-select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #d4c4a8;
            border-radius: 4px;
            font-size: 15px;
            outline: none;
            background: #fff;
            color: #333;
        }

        .search-select:focus {
            border-color: #b8860b;
        }

        /* 관리자 비밀번호 */
        .pw-box {
            display: none;
            background: #fff;
            border: 2px solid #b8860b;
            padding: 15px;
            text-align: center;
            max-width: 300px;
            margin: 15px auto;
            border-radius: 6px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .pw-box p {
            margin-top: 0;
            font-weight: bold;
        }

        .pw-box input {
            padding: 8px;
            border: 1px solid #ccc;
            width: 120px;
            border-radius: 4px;
            outline: none;
        }

        .pw-box input:focus {
            border-color: #b8860b;
        }

        .pw-box button {
            background: #111;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
        }

        .pw-box button:hover {
            background: #333;
        }

        /* 관리자 패널 */
        .admin-panel {
            display: none;
            background: #f9f9f9;
            border: 2px solid #b8860b;
            padding: 20px;
            margin-top: 15px;
            border-radius: 6px;
        }

        .admin-panel h3 {
            margin-top: 0;
            color: #555;
        }

        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .form-row input,
        .form-row select {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }

        .form-row input:focus,
        .form-row select:focus {
            border-color: #b8860b;
        }

        .btn-submit {
            background: #b8860b;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-submit:hover {
            background: #d4a017;
        }

        .btn-cancel {
            background: #666;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            display: none;
        }

        .btn-cancel:hover {
            background: #555;
        }

        .btn-download {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            margin-left: auto;
        }

        .btn-download:hover {
            background: #388e3c;
        }

        /* 회원 목록 */
        .member-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .member-item {
            display: flex;
            align-items: center;
            padding: 12px 10px;
            border-bottom: 1px solid #eee;
            background: #fff;
        }

        .member-item:hover {
            background: #fafafa;
        }

        .tag-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 80px;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .status-tag {
            border: 1px solid #d4c4a8;
            background-color: #faf7f2;
            color: #705e43;
            font-size: 11px;
            padding: 3px 0;
            border-radius: 2px;
            text-align: center;
            font-weight: bold;
        }

        .status-tag.empty {
            border: 1px dashed #eee;
            background-color: transparent;
            color: #ccc;
        }

        .info-box {
            flex-grow: 1;
            min-width: 0;
        }

        .name-line {
            font-size: 16px;
            font-weight: bold;
            color: #222;
            word-break: break-word;
        }

        .name-line span {
            font-size: 14px;
            font-weight: normal;
            color: #555;
        }

        .detail-line {
            font-size: 12px;
            color: #777;
            margin-top: 3px;
            word-break: break-word;
        }

        .admin-actions {
            display: flex;
            gap: 5px;
            margin-left: 10px;
            flex-shrink: 0;
        }

        .btn-edit {
            background: #007bff;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-edit:hover {
            background: #0069d9;
        }

        .btn-delete {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-delete:hover {
            background: #e53935;
        }

        .guide-text {
            text-align: center;
            color: #888;
            padding: 25px;
            font-size: 14px;
            background: #fafafa;
            border-radius: 6px;
            margin-top: 10px;
        }

        /* 모바일 */
        @media (max-width: 700px) {

            .content {
                padding: 12px;
            }

            .header {
                padding: 30px 15px;
            }

            .title-main {
                font-size: 28px;
            }

            .title-sub {
                font-size: 18px;
            }

            .section-header {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }

            .search-box-inline {
                width: 100%;
            }

            .member-item {
                align-items: flex-start;
            }

            .tag-box {
                width: 70px;
                margin-right: 10px;
            }

            .admin-actions {
                flex-direction: column;
            }

            .btn-download {
                margin-left: 0;
                width: 100%;
            }

            .form-row input,
            .form-row select {
                width: 100%;
            }

            .form-row label {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- ==============================
         상단 헤더
    =============================== -->

    <div class="header">

        <div class="title-main">
            大韓民國 상단
        </div>

        <div class="server-tag">
            현무서버
        </div>

        <div class="title-sub">
            大韓民國 상단 사천왕 보유 현황
        </div>

        <div class="admin-btn-container">

            <button
                class="admin-btn"
                id="loginBtn"
                type="button"
            >
                ⚙️ 관리자 인증 모드
            </button>

        </div>

    </div>


    <div class="content">

        <!-- ==============================
             관리자 비밀번호
        =============================== -->

        <div id="pwBox" class="pw-box">

            <p>
                비밀번호를 입력하세요
            </p>

            <input
                type="password"
                id="adminPw"
                placeholder="암호 입력"
                autocomplete="off"
            >

            <button
                type="button"
                id="pwSubmitBtn"
            >
                확인
            </button>

        </div>


        <!-- ==============================
             관리자 관리 패널
        =============================== -->

        <div id="adminPanel" class="admin-panel">

            <h3 id="panelTitle">
                🛠️ 상단원 정보 관리 (등록 모드)
            </h3>

            <input
                type="hidden"
                id="editIndex"
                value=""
            >


            <div class="form-row">

                <select id="addPosition">

                    <option value="임원진">
                        임원진
                    </option>

                    <option value="상단명단">
                        일반 상단원
                    </option>

                </select>


                <input
                    type="text"
                    id="addName"
                    placeholder="본캐 닉네임"
                >


                <input
                    type="text"
                    id="addSubs"
                    placeholder="부캐릭터"
                >


                <input
                    type="text"
                    id="addDuty"
                    placeholder="직책 (예: 대방, 행수)"
                >


                <select id="addKing">

                    <option value="지국천왕">
                        지국천왕
                    </option>

                    <option value="다문천왕">
                        다문천왕
                    </option>

                    <option value="광목천왕">
                        광목천왕
                    </option>

                    <option value="증장천왕">
                        증장천왕
                    </option>

                    <option value="보유 없음">
                        보유 없음
                    </option>

                </select>

            </div>


            <div class="form-row">

                <label>
                    <input
                        type="checkbox"
                        id="check2nd"
                    >
                    2차 완료
                </label>


                <label>
                    <input
                        type="checkbox"
                        id="checkAwaken"
                    >
                    각성 완료
                </label>


                <button
                    class="btn-submit"
                    id="submitBtn"
                    type="button"
                >
                    등록하기
                </button>


                <button
                    class="btn-cancel"
                    id="cancelBtn"
                    type="button"
                >
                    취소
                </button>


                <button
                    class="btn-download"
                    id="downloadBtn"
                    type="button"
                >
                    📥 명단 엑셀 다운로드
                </button>

            </div>

        </div>


        <!-- ==============================
             사천왕 필터
        =============================== -->

        <div
            class="filter-row"
            style="margin-top:20px;"
        >

            <select
                id="kingFilter"
                class="search-select"
            >

                <option value="전체">
                    전체 사천왕 보기
                </option>

                <option value="지국천왕">
                    지국천왕 명단
                </option>

                <option value="다문천왕">
                    다문천왕 명단
                </option>

                <option value="광목천왕">
                    광목천왕 명단
                </option>

                <option value="증장천왕">
                    증장천왕 명단
                </option>

            </select>

        </div>


        <!-- ==============================
             상단 명단
        =============================== -->

        <div
            class="section-header"
            style="margin-top:25px;"
        >

            <div class="section-title">

                02 상단명단

                <span
                    class="member-count"
                    id="memberCount"
                >
                    (총 0명)
                </span>

            </div>


            <div class="search-container">

                <div class="search-box-inline">

                    <input
                        type="text"
                        id="searchKeyword"
                        class="search-input"
                        placeholder="본캐 닉네임 검색"
                    >

                    <button
                        type="button"
                        id="searchBtn"
                        class="search-btn"
                    >
                        검색
                    </button>

                </div>

            </div>

        </div>


        <ul
            id="memberList"
            class="member-list"
        ></ul>

    </div>


    <script>

        /* ==================================================
           기본 회원 데이터
        ================================================== */

        let members = JSON.parse(
            localStorage.getItem('git_members')
        ) || [

            {
                position: "임원진",
                name: "한라",
                duty: "대방",
                subs: "소왕자리, 대왕자리, 추분, 강제",
                king: "지국천왕",
                check2nd: true,
                checkAwaken: true
            },

            {
                position: "임원진",
                name: "아리안드",
                duty: "대행수",
                subs: "수락산, 아리안데",
                king: "다문천왕",
                check2nd: false,
                checkAwaken: false
            },

            {
                position: "임원진",
                name: "번개의호흡",
                duty: "도방",
                subs: "물의호흡, 짐승의호흡, 무료도우미",
                king: "광목천왕",
                check2nd: false,
                checkAwaken: false
            },

            {
                position: "상단명단",
                name: "오조",
                duty: "일반",
                subs: "오조2호기",
                king: "지국천왕",
                check2nd: true,
                checkAwaken: false
            },

            {
                position: "상단명단",
                name: "왕초김춘삼",
                duty: "일반",
                subs: "",
                king: "다문천왕",
                check2nd: false,
                checkAwaken: false
            }

        ];


        let isAdmin = false;


        /* ==================================================
           HTML 요소
        ================================================== */

        const loginBtn =
            document.getElementById('loginBtn');

        const pwBox =
            document.getElementById('pwBox');

        const adminPw =
            document.getElementById('adminPw');

        const pwSubmitBtn =
            document.getElementById('pwSubmitBtn');

        const adminPanel =
            document.getElementById('adminPanel');

        const memberList =
            document.getElementById('memberList');

        const memberCount =
            document.getElementById('memberCount');

        const kingFilter =
            document.getElementById('kingFilter');

        const searchKeyword =
            document.getElementById('searchKeyword');

        const searchBtn =
            document.getElementById('searchBtn');

        const addPosition =
            document.getElementById('addPosition');

        const addName =
            document.getElementById('addName');

        const addSubs =
            document.getElementById('addSubs');

        const addDuty =
            document.getElementById('addDuty');

        const addKing =
            document.getElementById('addKing');

        const check2nd =
            document.getElementById('check2nd');

        const checkAwaken =
            document.getElementById('checkAwaken');

        const editIndex =
            document.getElementById('editIndex');

        const submitBtn =
            document.getElementById('submitBtn');

        const cancelBtn =
            document.getElementById('cancelBtn');

        const panelTitle =
            document.getElementById('panelTitle');

        const downloadBtn =
            document.getElementById('downloadBtn');


        /* ==================================================
           관리자 로그인 버튼
        ================================================== */

        loginBtn.addEventListener(
            'click',
            function () {

                if (isAdmin) {

                    isAdmin = false;

                    loginBtn.textContent =
                        "⚙️ 관리자 인증 모드";

                    adminPanel.style.display =
                        "none";

                    pwBox.style.display =
                        "none";

                    clearForm();

                    renderList();

                } else {

                    pwBox.style.display =
                        pwBox.style.display === "block"
                            ? "none"
                            : "block";

                    if (
                        pwBox.style.display === "block"
                    ) {
                        adminPw.focus();
                    }

                }

            }
        );


        /* ==================================================
           관리자 비밀번호

           ★ 현재 비밀번호 : 1357
        ================================================== */

        pwSubmitBtn.addEventListener(
            'click',
            function () {

                if (adminPw.value === "1357") {

                    isAdmin = true;

                    loginBtn.textContent =
                        "🔒 관리자 로그아웃";

                    pwBox.style.display =
                        "none";

                    adminPanel.style.display =
                        "block";

                    adminPw.value = "";

                    renderList();

                } else {

                    alert(
                        "비밀번호가 틀렸습니다!"
                    );

                    adminPw.value = "";

                    adminPw.focus();

                }

            }
        );


        /* ==================================================
           비밀번호 입력 후 엔터
        ================================================== */

        adminPw.addEventListener(
            'keyup',
            function (e) {

                if (e.key === "Enter") {

                    pwSubmitBtn.click();

                }

            }
        );


        /* ==================================================
           회원 목록 렌더링
        ================================================== */

        function renderList() {

            memberList.innerHTML = "";


            const filterValue =
                kingFilter.value;


            const keyword =
                searchKeyword.value
                    .trim()
                    .toLowerCase();


            /* 사천왕 + 닉네임 필터 */

            const filteredMembers =
                members.filter(
                    function (m) {

                        const matchesKing =
                            filterValue === "전체" ||
                            m.king === filterValue;


                        const matchesKeyword =
                            keyword === "" ||
                            String(m.name)
                                .toLowerCase()
                                .includes(keyword);


                        return (
                            matchesKing &&
                            matchesKeyword
                        );

                    }
                );


            /* 총 인원 표시 */

            memberCount.textContent =
                `(총 ${filteredMembers.length}명)`;


            /* 결과 없음 */

            if (
                filteredMembers.length === 0
            ) {

                memberList.innerHTML = `
                    <div class="guide-text">
                        조건에 맞는 상단원이 없습니다.
                    </div>
                `;

                return;

            }


            /* 회원 목록 출력 */

            filteredMembers.forEach(
                function (m) {

                    const actualIndex =
                        members.indexOf(m);


                    const li =
                        document.createElement('li');


                    li.className =
                        "member-item";


                    /* 2차 상태 */

                    const tag2nd =
                        m.check2nd
                            ? `<span class="status-tag">
                                2차 완료
                               </span>`
                            : `<span class="status-tag empty">
                                미완료
                               </span>`;


                    /* 각성 상태 */

                    const tagAwaken =
                        m.checkAwaken
                            ? `<span class="status-tag">
                                각성 완료
                               </span>`
                            : `<span class="status-tag empty">
                                미완료
                               </span>`;


                    /* 임원진 직책 */

                    const dutyText =
                        m.position === "임원진" &&
                        m.duty
                            ? `[${escapeHtml(m.duty)}]`
                            : "";


                    /* 관리자 버튼 */

                    let actionHtml = "";


                    if (isAdmin) {

                        actionHtml = `

                            <div class="admin-actions">

                                <button
                                    class="btn-edit"
                                    type="button"
                                    onclick="editMember(${actualIndex})"
                                >
                                    수정
                                </button>

                                <button
                                    class="btn-delete"
                                    type="button"
                                    onclick="deleteMember(${actualIndex})"
                                >
                                    삭제
                                </button>

                            </div>

                        `;

                    }


                    /* 회원 HTML */

                    li.innerHTML = `

                        <div class="tag-box">

                            ${tag2nd}

                            ${tagAwaken}

                        </div>


                        <div class="info-box">

                            <div class="name-line">

                                ${escapeHtml(m.name)}

                                ${
                                    dutyText
                                        ? `
                                            <span
                                                style="
                                                    color:#b8860b;
                                                    font-weight:bold;
                                                    margin-left:6px;
                                                "
                                            >
                                                ${dutyText}
                                            </span>
                                          `
                                        : ""
                                }

                                <span
                                    style="
                                        margin-left:5px;
                                    "
                                >
                                    (${escapeHtml(m.king)})
                                </span>

                            </div>


                            <div class="detail-line">

                                부캐:
                                ${
                                    m.subs
                                        ? escapeHtml(m.subs)
                                        : "없음"
                                }

                            </div>

                        </div>


                        ${actionHtml}

                    `;


                    memberList.appendChild(li);

                }
            );

        }


        /* ==================================================
           등록 / 수정
        ================================================== */

        submitBtn.addEventListener(
            'click',
            function () {

                const position =
                    addPosition.value;


                const name =
                    addName.value.trim();


                const subs =
                    addSubs.value.trim();


                const duty =
                    addDuty.value.trim() ||
                    "일반";


                const king =
                    addKing.value;


                const completed2nd =
                    check2nd.checked;


                const awakened =
                    checkAwaken.checked;


                const currentEditIndex =
                    editIndex.value;


                /* 이름 확인 */

                if (!name) {

                    alert(
                        "본캐 닉네임을 입력해주세요!"
                    );

                    addName.focus();

                    return;

                }


                /* 회원 데이터 */

                const memberData = {

                    position: position,

                    name: name,

                    subs: subs,

                    duty: duty,

                    king: king,

                    check2nd: completed2nd,

                    checkAwaken: awakened

                };


                /* 수정 */

                if (
                    currentEditIndex !== ""
                ) {

                    const index =
                        parseInt(
                            currentEditIndex,
                            10
                        );


                    members[index] =
                        memberData;


                    editIndex.value = "";


                    submitBtn.textContent =
                        "등록하기";


                    panelTitle.textContent =
                        "🛠️ 상단원 정보 관리 (등록 모드)";


                    cancelBtn.style.display =
                        "none";


                    alert(
                        "상단원 정보가 수정되었습니다."
                    );

                }

                /* 신규 등록 */

                else {

                    members.push(
                        memberData
                    );


                    alert(
                        "상단원이 등록되었습니다."
                    );

                }


                /* 저장 */

                localStorage.setItem(
                    'git_members',
                    JSON.stringify(members)
                );


                clearForm();

                renderList();

            }
        );


        /* ==================================================
           회원 수정
        ================================================== */

        window.editMember =
            function (index) {

                const m =
                    members[index];


                if (!m) {
                    return;
                }


                addPosition.value =
                    m.position ||
                    "상단명단";


                addName.value =
                    m.name ||
                    "";


                addSubs.value =
                    m.subs ||
                    "";


                addDuty.value =
                    m.duty ||
                    "";


                addKing.value =
                    m.king ||
                    "보유 없음";


                check2nd.checked =
                    Boolean(m.check2nd);


                checkAwaken.checked =
                    Boolean(m.checkAwaken);


                editIndex.value =
                    index;


                submitBtn.textContent =
                    "수정완료";


                panelTitle.textContent =
                    "🛠️ 상단원 정보 관리 (수정 모드)";


                cancelBtn.style.display =
                    "inline-block";


                adminPanel.scrollIntoView({
                    behavior: "smooth",
                    block: "center"
                });

            };


        /* ==================================================
           수정 취소
        ================================================== */

        cancelBtn.addEventListener(
            'click',
            function () {

                clearForm();


                editIndex.value =
                    "";


                submitBtn.textContent =
                    "등록하기";


                panelTitle.textContent =
                    "🛠️ 상단원 정보 관리 (등록 모드)";


                cancelBtn.style.display =
                    "none";

            }
        );


        /* ==================================================
           회원 삭제
        ================================================== */

        window.deleteMember =
            function (index) {

                const m =
                    members[index];


                if (!m) {
                    return;
                }


                const confirmed =
                    confirm(
                        `"${m.name}" 상단원을 정말 삭제하시겠습니까?`
                    );


                if (!confirmed) {
                    return;
                }


                members.splice(
                    index,
                    1
                );


                localStorage.setItem(
                    'git_members',
                    JSON.stringify(members)
                );


                renderList();

            };


        /* ==================================================
           입력 폼 초기화
        ================================================== */

        function clearForm() {

            addPosition.value =
                "임원진";


            addName.value =
                "";


            addSubs.value =
                "";


            addDuty.value =
                "";


            addKing.value =
                "지국천왕";


            check2nd.checked =
                false;


            checkAwaken.checked =
                false;

        }


        /* ==================================================
           CSV / 엑셀 다운로드
        ================================================== */

        downloadBtn.addEventListener(
            'click',
            function () {

                if (
                    members.length === 0
                ) {

                    alert(
                        "다운로드할 상단원이 없습니다."
                    );

                    return;

                }


                /* CSV 제목 */

                let csvContent =
                    "\uFEFF구분,본캐 닉네임,부캐릭터,직책,사천왕,2차여부,각성여부\n";


                /* 회원 데이터 */

                members.forEach(
                    function (m) {

                        const position =
                            csvEscape(
                                m.position === "임원진"
                                    ? "임원진"
                                    : "일반 상단원"
                            );


                        const name =
                            csvEscape(
                                m.name
                            );


                        const subs =
                            csvEscape(
                                m.subs || ""
                            );


                        const duty =
                            csvEscape(
                                m.duty || "일반"
                            );


                        const king =
                            csvEscape(
                                m.king
                            );


                        const c2 =
                            m.check2nd
                                ? "완료"
                                : "미완료";


                        const cA =
                            m.checkAwaken
                                ? "완료"
                                : "미완료";


                        csvContent +=
                            `${position},${name},${subs},${duty},${king},${c2},${cA}\n`;

                    }
                );


                /* CSV 파일 생성 */

                const blob =
                    new Blob(
                        [csvContent],
                        {
                            type:
                                'text/csv;charset=utf-8;'
                        }
                    );


                const url =
                    URL.createObjectURL(
                        blob
                    );


                const link =
                    document.createElement(
                        "a"
                    );


                link.href =
                    url;


                link.download =
                    "상단원명단.csv";


                document.body.appendChild(
                    link
                );


                link.click();


                document.body.removeChild(
                    link
                );


                URL.revokeObjectURL(
                    url
                );

            }
        );


        /* ==================================================
           CSV 안전 처리
        ================================================== */

        function csvEscape(value) {

            const text =
                String(
                    value ?? ""
                );


            if (
                text.includes(",") ||
                text.includes('"') ||
                text.includes("\n")
            ) {

                return `"${text.replace(
                    /"/g,
                    '""'
                )}"`;

            }


            return text;

        }


        /* ==================================================
           HTML 안전 처리
        ================================================== */

        function escapeHtml(value) {

            return String(
                value ?? ""
            )
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* ==================================================
           검색 / 필터
        ================================================== */

        kingFilter.addEventListener(
            'change',
            renderList
        );


        searchBtn.addEventListener(
            'click',
            renderList
        );


        searchKeyword.addEventListener(
            'keyup',
            function (e) {

                if (
                    e.key === "Enter"
                ) {

                    renderList();

                }

            }
        );


        /* 입력하면서 바로 검색 */

        searchKeyword.addEventListener(
            'input',
            renderList
        );


        /* ==================================================
           최초 실행
        ================================================== */

        renderList();

    </script>

</body>
</html>
