<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大韓國 상단 - 현무서버</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Malgun Gothic', sans-serif;
            padding: 0;
            margin: 0;
            background-color: #ffffff;
            color: #333;
        }

        /* =========================
           헤더
        ========================= */

        .header {
            background: linear-gradient(180deg, #444 0%, #222 100%);
            text-align: center;
            padding: 40px 20px;
            color: white;
        }

        .title-main {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .server-tag {
            background: #b8860b;
            color: #fff;
            padding: 3px 15px;
            border-radius: 15px;
            font-size: 14px;
            display: inline-block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .title-sub {
            font-size: 22px;
            font-weight: bold;
            color: #eee;
        }

        .admin-btn-container {
            margin-top: 15px;
            text-align: center;
        }

        .admin-btn {
            background: #b8860b;
            color: #fff;
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .admin-btn:hover {
            background: #966f0a;
        }

        /* =========================
           본문
        ========================= */

        .content {
            max-width: 800px;
            margin: 3px auto;
            padding: 20px;
        }

        /* =========================
           검색
        ========================= */

        .search-box {
            margin: 5px 0 20px 0;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 13px 45px 13px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            background: #fafafa;
        }

        .search-input:focus {
            border-color: #b8860b;
            background: #fff;
        }

        .search-icon {
            position: absolute;
            right: 15px;
            top: 11px;
            font-size: 18px;
            color: #888;
            pointer-events: none;
        }

        /* =========================
           섹션 제목
        ========================= */

        .section-title {
            font-size: 18px;
            font-weight: bold;
            color: #b8860b;
            margin-top: 30px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .member-count {
            font-size: 15px;
            color: #777;
            font-weight: bold;
            margin-left: 4px;
        }

        /* =========================
           비밀번호
        ========================= */

        .pw-box {
            display: none;
            background: #fff;
            border: 2px solid #b8860b;
            padding: 15px;
            text-align: center;
            max-width: 300px;
            margin: 15px auto;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .pw-box p {
            margin: 0 0 10px 0;
            font-size: 14px;
            font-weight: bold;
            color: #000;
        }

        .pw-box input {
            padding: 8px;
            border: 1px solid #ccc;
            width: 120px;
            border-radius: 4px;
            font-size: 14px;
            color: #000;
        }

        .pw-box button {
            background: #111;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-left: 5px;
        }

        /* =========================
           관리자 패널
        ========================= */

        .admin-panel {
            display: none;
            background: #f9f9f9;
            border: 2px solid #b8860b;
            padding: 20px;
            margin-top: 15px;
            border-radius: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .admin-panel h3 {
            margin-top: 0;
            color: #222;
            font-size: 16px;
            margin-bottom: 15px;
        }

        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        .form-row input,
        .form-row select {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        .checkbox-group {
            display: flex;
            gap: 15px;
            font-size: 14px;
            font-weight: bold;
            color: #555;
        }

        .btn-submit {
            background: #b8860b;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .btn-submit:hover {
            background: #966f0a;
        }

        .btn-cancel {
            background: #777;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            display: none;
        }

        .btn-cancel:hover {
            background: #555;
        }

        /* =========================
           데이터 백업 섹션
        ========================= */

        .data-sync-box {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px dashed #ccc;
            display: flex;
        }

        .btn-backup {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            width: 100%;
        }

        .btn-backup:hover {
            background: #1b5e20;
        }

        /* =========================
           명단
        ========================= */

        .member-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .member-item {
            display: flex;
            align-items: center;
            padding: 15px 10px;
            border-bottom: 1px solid #eee;
        }

        .tag-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 80px;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .status-tag {
            border: 1px solid #d4c4a8;
            background-color: #faf7f2;
            color: #705e43;
            font-size: 11px;
            padding: 3px 0;
            border-radius: 2px;
            text-align: center;
            font-weight: bold;
        }

        .status-tag.empty {
            border: 1px dashed #eee;
            background-color: transparent;
            color: #ccc;
        }

        .info-box {
            flex-grow: 1;
            min-width: 0;
        }

        .name-line {
            font-size: 18px;
            font-weight: bold;
            color: #222;
            margin-bottom: 4px;
            word-break: break-word;
        }

        .name-line span {
            font-size: 16px;
            font-weight: normal;
            color: #555;
        }

        .detail-line {
            font-size: 13px;
            color: #777;
        }

        /* =========================
           관리자 버튼
        ========================= */

        .admin-actions {
            display: flex;
            gap: 5px;
            margin-left: 10px;
            flex-shrink: 0;
        }

        .btn-edit {
            background: #555;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .btn-edit:hover {
            background: #333;
        }

        .btn-delete {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .btn-delete:hover {
            background: #cc0000;
        }

        /* =========================
           검색 결과 없음
        ========================= */

        .no-result {
            display: none;
            text-align: center;
            padding: 30px 10px;
            color: #999;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .header { padding: 30px 15px; }
            .title-main { font-size: 28px; }
            .title-sub { font-size: 18px; }
            .content { padding: 15px; }
            .form-row input, .form-row select { width: 100% !important; }
            .checkbox-group { width: 100%; }
            .btn-submit, .btn-cancel { width: 100%; margin-left: 0 !important; }
            .member-item { padding: 13px 5px; }
            .tag-box { width: 70px; margin-right: 10px; }
            .name-line { font-size: 16px; }
            .name-line span { font-size: 13px; }
            .detail-line { font-size: 12px; }
            .admin-actions { flex-direction: column; margin-left: 5px; }
            .btn-edit, .btn-delete { padding: 5px 8px; }
        }
    </style>
</head>

<body>

<div class="header">
    <div class="title-main">大韓國 상단</div>
    <div class="server-tag">현무서버</div>
    <div class="title-sub">대한민국 상단 사천왕 보유 현황</div>
    <div class="admin-btn-container">
        <button class="admin-btn" id="loginBtn" type="button" onclick="togglePasswordInputBox()">⚙️ 관리자 인증 모드</button>
    </div>
</div>

<div class="content">
    <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="🔎 본캐, 부캐, 사천왕, 직책 검색..." autocomplete="off">
        <span class="search-icon">🔍</span>
    </div>

    <div id="pwBox" class="pw-box">
        <p>비밀번호를 입력하세요</p>
        <input type="password" id="adminPw" placeholder="암호 입력" autocomplete="off">
        <button type="button" onclick="checkAdminPasswordV2()">확인</button>
    </div>

    <div id="adminPanel" class="admin-panel">
        <h3>🛠️ 상단원 정보 관리</h3>
        <div class="form-row">
            <select id="addPosition">
                <option value="임원진">임원진</option>
                <option value="상단명단">일반 상단원</option>
            </select>
            <input type="text" id="addName" style="width:130px;" placeholder="본캐 닉네임">
            <input type="text" id="addSubs" style="width:180px;" placeholder="부캐릭터 (쉼표 분리)">
            <input type="text" id="addDuty" style="width:100px;" placeholder="직책 (예: 대행수)">
            <select id="addKing">
                <option value="지국천왕">지국천왕</option>
                <option value="다문천왕">다문천왕</option>
                <option value="광목천왕">광목천왕</option>
                <option value="증장천왕">증장천왕</option>
                <option value="보유 없음">보유 없음</option>
            </select>
        </div>

        <div class="form-row">
            <div class="checkbox-group">
                <label><input type="checkbox" id="check2nd"> 2차 완료</label>
                <label><input type="checkbox" id="checkAwaken"> 각성 완료</label>
            </div>
            <button class="btn-submit" id="submitBtn" type="button" style="margin-left:auto;" onclick="saveMember()">등록하기</button>
            <button class="btn-cancel" id="cancelBtn" type="button" onclick="cancelEdit()">수정 취소</button>
        </div>

        <div class="data-sync-box">
            <button class="btn-backup" type="button" onclick="exportToExcel()">📊 상단원 명부 엑셀 다운로드 (CSV)</button>
        </div>
    </div>

    <div class="section-title">
        01 임원진 <span class="member-count" id="executiveCount">(00)</span>
    </div>
    <ul id="executiveList" class="member-list"></ul>
    <div id="executiveNoResult" class="no-result">검색 결과가 없습니다.</div>

    <div class="section-title">
        02 상단명단 <span class="member-count" id="regularCount">(00)</span>
    </div>
    <ul id="regularList" class="member-list"></ul>
    <div id="regularNoResult" class="no-result">검색 결과가 없습니다.</div>
</div>

<script>
    // ⚠️ 방금 구글 배포 화면에서 복사한 주소를 아래 큰따옴표 안에 넣었습니다!
    var GAS_URL = https://script.google.com/macros/s/AKfycbwQrbwrVOJIrbIPlh8eO4pMnVPJq-rdasSnu4Opue5Ye1vYy3Eg5j4MtG-FrwVknpW7bA/exec

    var members = [];
    var editingIndex = -1;

    // 구글 시트에서 데이터 불러오기
    function loadMemberData() {
        if (!GAS_URL) return;
        fetch(GAS_URL)
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (Array.isArray(data)) {
                    members = data;
                    renderLists();
                }
            })
            .catch(function(err) {
                console.error("데이터 불러오기 실패:", err);
            });
    }

    // 구글 시트로 데이터 동기화
    function saveMemberData() {
        if (!GAS_URL) return true;
        
        fetch(GAS_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(members)
        })
        .then(function() {
            console.log("구글 시트 저장 성공");
        })
        .catch(function(err) {
            console.error("구글 시트 저장 실패:", err);
        });
        
        return true;
    }

    function exportToExcel() {
        if (!members || members.length === 0) {
            alert("다운로드할 상단원 데이터가 없습니다.");
            return;
        }
        var csvContent = "구분,본캐 닉네임,부캐릭터,직책,사천왕,2차 완료,각성 완료\n";
        members.forEach(function(m) {
            var row = [
                '"' + (m.position || '') + '"',
                '"' + (m.name || '') + '"',
                '"' + (m.subs || '') + '"',
                '"' + (m.duty || '') + '"',
                '"' + (m.king || '') + '"',
                m.is2nd ? "완료" : "미완료",
                m.isAwaken ? "완료" : "미완료"
            ];
            csvContent += row.join(",") + "\n";
        });
        var blob = new Blob(["\ufeff" + csvContent], { type: 'text/csv;charset=utf-8;' });
        var url = URL.createObjectURL(blob);
        var date = new Date();
        var dateStr = date.toISOString().slice(0, 10);
        var downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", url);
        downloadAnchor.setAttribute("download", "상단원명부_" + dateStr + ".csv");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        URL.revokeObjectURL(url);
    }

    function isAdminLoggedIn() {
        return sessionStorage.getItem('is_admin_logged_in') === 'true';
    }

    function checkSessionAdminState() {
        if (isAdminLoggedIn()) {
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('loginBtn').innerText = '🔒 관리자 모드 종료';
        }
    }

    function getSearchKeyword() {
        var input = document.getElementById('searchInput');
        return input ? input.value.trim().toLowerCase() : '';
    }

    function memberMatchesSearch(member, keyword) {
        if (!keyword) return true;
        var searchText = [
            member.name || '', member.subs || '', member.duty || '', member.king || '', member.position || ''
        ].join(' ').toLowerCase();
        return searchText.indexOf(keyword) !== -1;
    }

    function escapeHtml(text) {
        if (text === null || text === undefined) return '';
        return String(text)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }

    function renderLists() {
        var execContainer = document.getElementById('executiveList');
        var regContainer = document.getElementById('regularList');
        if (!execContainer || !regContainer) return;

        execContainer.innerHTML = '';
        regContainer.innerHTML = '';

        var execCount = members.filter(function(m) { return m.position === '임원진'; }).length;
        var regCount = members.filter(function(m) { return m.position !== '임원진'; }).length;

        document.getElementById('executiveCount').innerText = '(' + String(execCount).padStart(2, '0') + ')';
        document.getElementById('regularCount').innerText = '(' + String(regCount).padStart(2, '0') + ')';

        var keyword = getSearchKeyword();
        var executiveFound = false;
        var regularFound = false;

        members.forEach(function(member, index) {
            if (!memberMatchesSearch(member, keyword)) return;

            var li = document.createElement('li');
            li.className = 'member-item';

            var tag1 = member.is2nd ? '<div class="status-tag">2차 완료</div>' : '<div class="status-tag empty">-</div>';
            var tag2 = member.isAwaken ? '<div class="status-tag">각성 완료</div>' : '<div class="status-tag empty">-</div>';
            var subsText = member.subs ? ' / ' + member.subs : ' / 없음';
            var dutyText = member.duty ? ' · ' + member.duty : '';

            var actionButtons = '';
            if (isAdminLoggedIn()) {
                actionButtons = '<div class="admin-actions">' +
                    '<button class="btn-edit" type="button" onclick="editMember(' + index + ')">수정</button>' +
                    '<button class="btn-delete" type="button" onclick="deleteMember(' + index + ')">삭제</button>' +
                '</div>';
            }

            li.innerHTML = '<div class="tag-box">' + tag1 + tag2 + '</div>' +
                '<div class="info-box">' +
                    '<div class="name-line">' + escapeHtml(member.name) + ' <span>' + escapeHtml(subsText) + '</span></div>' +
                    '<div class="detail-line">' + escapeHtml(member.king) + escapeHtml(dutyText) + '</div>' +
                '</div>' + actionButtons;

            if (member.position === '임원진') {
                execContainer.appendChild(li);
                executiveFound = true;
            } else {
                regContainer.appendChild(li);
                regularFound = true;
            }
        });

        document.getElementById('executiveNoResult').style.display = keyword && !executiveFound ? 'block' : 'none';
        document.getElementById('regularNoResult').style.display = keyword && !regularFound ? 'block' : 'none';
    }

    function togglePasswordInputBox() {
        var pwBox = document.getElementById('pwBox');
        var adminPanel = document.getElementById('adminPanel');
        var loginBtn = document.getElementById('loginBtn');

        if (isAdminLoggedIn()) {
            sessionStorage.removeItem('is_admin_logged_in');
            adminPanel.style.display = 'none';
            loginBtn.innerText = '⚙️ 관리자 인증 모드';
            cancelEdit();
            renderLists();
            return;
        }

        if (pwBox.style.display === 'block') {
            pwBox.style.display = 'none';
        } else {
            pwBox.style.display = 'block';
            var input = document.getElementById('adminPw');
            input.value = '';
            setTimeout(function() { input.focus(); }, 100);
        }
    }

    function checkAdminPasswordV2() {
        var input = document.getElementById('adminPw');
        if (input.value.trim() === '1357') {
            sessionStorage.setItem('is_admin_logged_in', 'true');
            document.getElementById('pwBox').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            document.getElementById('loginBtn').innerText = '🔒 관리자 모드 종료';
            input.value = '';
            renderLists();
        } else {
            alert('비밀번호가 올바르지 않습니다.');
            input.value = '';
            input.focus();
        }
    }

    function saveMember() {
        if (!isAdminLoggedIn()) {
            alert('관리자 인증이 필요합니다.');
            return;
        }

        var name = document.getElementById('addName').value.trim();
        var subs = document.getElementById('addSubs').value.trim();
        var duty = document.getElementById('addDuty').value.trim();
        var king = document.getElementById('addKing').value;
        var position = document.getElementById('addPosition').value;
        var is2nd = document.getElementById('check2nd').checked;
        var isAwaken = document.getElementById('checkAwaken').checked;

        if (!name) {
            alert('본캐 닉네임을 입력해주세요.');
            document.getElementById('addName').focus();
            return;
        }

        var newMember = {
            name: name, subs: subs, duty: duty, king: king,
            is2nd: is2nd, isAwaken: isAwaken, position: position
        };

        if (editingIndex >= 0) {
            members[editingIndex] = newMember;
            saveMemberData();
            alert('상단원 정보가 수정되었습니다.');
            cancelEdit();
            renderLists();
            return;
        }

        members.push(newMember);
        saveMemberData();
        alert('상단원이 등록되었습니다.');
        resetForm();
        renderLists();
    }

    function editMember(index) {
        if (!isAdminLoggedIn()) {
            alert('관리자 인증이 필요합니다.');
            return;
        }
        var member = members[index];
        if (!member) return;

        editingIndex = index;
        document.getElementById('addPosition').value = member.position || '상단명단';
        document.getElementById('addName').value = member.name || '';
        document.getElementById('addSubs').value = member.subs || '';
        document.getElementById('addDuty').value = member.duty || '';
        document.getElementById('addKing').value = member.king || '보유 없음';
        document.getElementById('check2nd').checked = !!member.is2nd;
        document.getElementById('checkAwaken').checked = !!member.isAwaken;

        document.getElementById('submitBtn').innerText = '수정 완료';
        document.getElementById('cancelBtn').style.display = 'inline-block';
        document.getElementById('adminPanel').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function cancelEdit() {
        editingIndex = -1;
        resetForm();
        document.getElementById('submitBtn').innerText = '등록하기';
        document.getElementById('cancelBtn').style.display = 'none';
    }

    function deleteMember(index) {
        if (!isAdminLoggedIn()) {
            alert('관리자 인증이 필요합니다.');
            return;
        }
        var member = members[index];
        if (!member) return;

        if (confirm("'" + member.name + "' 님의 정보를 정말 삭제하시겠습니까?")) {
            members.splice(index, 1);
            saveMemberData();
            if (editingIndex === index) cancelEdit();
            renderLists();
        }
    }

    function resetForm() {
        document.getElementById('addPosition').value = '상단명단';
        document.getElementById('addName').value = '';
        document.getElementById('addSubs').value = '';
        document.getElementById('addDuty').value = '';
        document.getElementById('addKing').value = '지국천왕';
        document.getElementById('check2nd').checked = false;
        document.getElementById('checkAwaken').checked = false;
    }

    document.addEventListener('DOMContentLoaded', function() {
        loadMemberData();
        checkSessionAdminState();
        renderLists();

        var searchInput = document.getElementById('searchInput');
        if (searchInput) {
            searchInput.addEventListener('input', function() { renderLists(); });
        }

        var adminPwInput = document.getElementById('adminPw');
        if (adminPwInput) {
            adminPwInput.addEventListener('keyup', function(event) {
                if (event.key === 'Enter') checkAdminPasswordV2();
            });
        }
    });
</script>

</body>
</html>
