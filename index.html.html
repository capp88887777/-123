<!DOCTYPE html>
<html lang="ko">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>大韓民國 상단</title>

<style>

/* =====================================================
   기본
===================================================== */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f7f3ff;
    color:#222;
    font-family:
        "Noto Sans KR",
        "Malgun Gothic",
        sans-serif;
}

button,
input,
select{
    font-family:inherit;
}


/* =====================================================
   상단 배너
===================================================== */

.header{
    width:100%;
    overflow:hidden;
    background:#eee;
}

.header img{
    display:block;
    width:100%;
    height:auto;
    max-height:380px;
    object-fit:cover;
    object-position:center top;
}


/* =====================================================
   전체
===================================================== */

.container{
    width:min(1400px,94%);
    margin:22px auto 50px;
}


/* =====================================================
   통계
===================================================== */

.stats{
    display:grid;
    grid-template-columns:
        repeat(3,1fr);

    gap:14px;

    margin-bottom:18px;
}

.stat{
    background:white;

    border-radius:20px;

    padding:18px;

    text-align:center;

    box-shadow:
        0 5px 18px
        rgba(80,50,120,.08);
}

.stat-title{
    color:#888;
    font-size:14px;
}

.stat-number{
    margin-top:5px;

    font-size:30px;

    font-weight:900;

    color:#7250a4;
}


/* =====================================================
   검색
===================================================== */

.search-box{

    background:white;

    border-radius:20px;

    padding:16px;

    margin-bottom:22px;

    box-shadow:
        0 5px 18px
        rgba(80,50,120,.08);
}

.search-row{

    display:grid;

    grid-template-columns:
        1.5fr
        1fr
        1fr
        1fr;

    gap:10px;
}

.search-row input,
.search-row select{

    width:100%;

    padding:12px;

    border:
        1px solid #ddd;

    border-radius:10px;

    background:white;

    outline:none;
}

.search-row input:focus,
.search-row select:focus{

    border-color:#9d7cc7;

}


/* =====================================================
   제목
===================================================== */

.section-title{

    margin:
        25px 0 12px;

    padding-bottom:8px;

    border-bottom:
        1px solid #ddd;

    font-size:22px;

    font-weight:900;

    color:#614495;
}


/* =====================================================
   임원진
===================================================== */

.executives{

    display:grid;

    grid-template-columns:
        repeat(6,1fr);

    gap:12px;
}

.exec-card{

    background:white;

    border-radius:15px;

    padding:15px 10px;

    min-height:85px;

    text-align:center;

    box-shadow:
        0 5px 15px
        rgba(80,50,120,.08);

    transition:.2s;
}

.exec-card:hover{

    transform:
        translateY(-3px);

}

.exec-name{

    font-size:17px;

    font-weight:900;

    color:#5e4287;
}

.exec-duty{

    margin-top:5px;

    font-size:13px;

    color:#777;
}


/* =====================================================
   명단 테이블
===================================================== */

.table-wrap{

    width:100%;

    overflow-x:auto;

    background:white;

    border-radius:12px;

    box-shadow:
        0 5px 18px
        rgba(80,50,120,.08);
}

table{

    width:100%;

    min-width:1050px;

    border-collapse:
        collapse;
}

thead th{

    padding:12px 8px;

    background:
        linear-gradient(
            #b17d18,
            #96640a
        );

    color:white;

    font-size:14px;

    white-space:nowrap;
}

tbody td{

    padding:10px 8px;

    text-align:center;

    border-bottom:
        1px solid #eee;

    font-size:13px;
}

tbody tr:hover td{

    background:#fcfaff;

}

.main-name{

    font-weight:900;

    color:#4d3a69;
}


/* =====================================================
   ⭐ 사천왕 컬러 ⭐
===================================================== */

.king-badge{

    display:inline-block;

    min-width:82px;

    padding:
        5px 10px;

    border-radius:20px;

    font-size:12px;

    font-weight:900;

    background:white;
}


/* 지국 */

.king-jiguk{

    color:#9148c7;

    border:
        2px solid #b86be8;

    background:#fbf3ff;
}


/* 다문 */

.king-damun{

    color:#2474c7;

    border:
        2px solid #67a9ed;

    background:#f1f8ff;
}


/* 광목 */

.king-gwangmok{

    color:#299452;

    border:
        2px solid #70c889;

    background:#f1fff5;
}


/* 증장 */

.king-jeungjang{

    color:#e78a17;

    border:
        2px solid #f0a746;

    background:#fff8ed;
}


/* 없음 */

.king-none{

    color:#888;

    border:
        2px solid #ccc;

    background:#f7f7f7;
}


/* =====================================================
   완료 표시
===================================================== */

.complete{

    color:#098331;

    font-size:18px;

    font-weight:900;
}

.incomplete{

    color:#aaa;

    font-size:15px;
}


/* =====================================================
   관리 버튼
===================================================== */

.manage-btn{

    border:0;

    border-radius:6px;

    padding:
        6px 10px;

    margin:
        1px;

    color:white;

    cursor:pointer;

    font-size:12px;

    font-weight:700;
}

.edit-btn{

    background:#1769c2;
}

.delete-btn{

    background:#e33434;
}

.edit-btn:hover,
.delete-btn:hover{

    opacity:.8;
}


/* =====================================================
   관리자
===================================================== */

.admin-panel{

    display:none;

    margin-top:18px;

    background:
        linear-gradient(
            135deg,
            #fffdf7,
            #fff8ea
        );

    border:
        1px solid #e5d3ad;

    border-radius:12px;

    padding:18px;

    box-shadow:
        0 5px 18px
        rgba(80,50,120,.08);
}

.admin-panel.active{

    display:block;
}

.admin-title{

    font-size:19px;

    font-weight:900;

    color:#62471f;

    margin-bottom:15px;
}


/* =====================================================
   입력
===================================================== */

.form-grid{

    display:grid;

    grid-template-columns:
        1fr
        1.4fr
        1.4fr
        1fr
        1fr
        1.4fr;

    gap:9px;
}

.form-grid input,
.form-grid select{

    width:100%;

    padding:10px;

    border:
        1px solid #ddd;

    border-radius:8px;

    background:white;
}


/* =====================================================
   체크
===================================================== */

.check-area{

    display:flex;

    gap:25px;

    margin:
        12px 0;
}

.check-area label{

    font-size:14px;

    font-weight:700;
}


/* =====================================================
   관리자 버튼
===================================================== */

.admin-actions{

    display:flex;

    gap:8px;

    flex-wrap:wrap;
}

.admin-btn{

    border:0;

    border-radius:8px;

    padding:
        10px 17px;

    cursor:pointer;

    font-weight:800;
}

.add-btn{

    background:#c28b12;

    color:white;
}

.save-btn{

    background:#208342;

    color:white;
}

.cancel-btn{

    background:#999;

    color:white;
}

.backup-btn{

    background:#3377ae;

    color:white;
}


/* =====================================================
   푸터
===================================================== */

footer{

    text-align:center;

    color:#888;

    font-size:12px;

    padding:
        20px;
}


/* =====================================================
   모바일
===================================================== */

@media(max-width:1100px){

    .executives{

        grid-template-columns:
            repeat(3,1fr);
    }

}

@media(max-width:800px){

    .stats{

        grid-template-columns:
            1fr;
    }

    .search-row{

        grid-template-columns:
            1fr;
    }

    .executives{

        grid-template-columns:
            repeat(2,1fr);
    }

    .form-grid{

        grid-template-columns:
            1fr;
    }

}

@media(max-width:450px){

    .executives{

        grid-template-columns:
            1fr 1fr;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     상단 이미지
===================================================== -->

<header class="header">

    <img
        src="assets/banner.png"
        alt="大韓民國 상단 현무서버">

</header>



<div class="container">


<!-- =====================================================
     통계
===================================================== -->

<div class="stats">

    <div class="stat">

        <div class="stat-title">
            전체 인원
        </div>

        <div
            class="stat-number"
            id="totalCount">
            0
        </div>

    </div>


    <div class="stat">

        <div class="stat-title">
            임원진
        </div>

        <div
            class="stat-number"
            id="execCount">
            0
        </div>

    </div>


    <div class="stat">

        <div class="stat-title">
            일반 상단원
        </div>

        <div
            class="stat-number"
            id="normalCount">
            0
        </div>

    </div>

</div>



<!-- =====================================================
     검색
===================================================== -->

<div class="search-box">

    <div class="search-row">

        <input
            id="search"
            type="text"
            placeholder="🔎 닉네임 / 부캐릭터 검색..."
            oninput="render()">


        <select
            id="positionFilter"
            onchange="render()">

            <option value="">
                전체 직책
            </option>

            <option value="임원진">
                임원진
            </option>

            <option value="상단명단">
                일반 상단원
            </option>

        </select>


        <select
            id="kingFilter"
            onchange="render()">

            <option value="">
                전체 사천왕
            </option>

            <option value="지국천왕">
                지국천왕
            </option>

            <option value="다문천왕">
                다문천왕
            </option>

            <option value="광목천왕">
                광목천왕
            </option>

            <option value="증장천왕">
                증장천왕
            </option>

            <option value="보유 없음">
                보유 없음
            </option>

        </select>


        <select
            id="completeFilter"
            onchange="render()">

            <option value="">
                전체 완료 여부
            </option>

            <option value="2nd">
                2차 완료
            </option>

            <option value="awaken">
                각성 완료
            </option>

        </select>

    </div>

</div>



<!-- =====================================================
     임원진
===================================================== -->

<div class="section-title">

    👑 임원진
    (<span id="execTitle">0</span>명)

</div>


<div
    id="executives"
    class="executives">
</div>



<!-- =====================================================
     상단 명단
===================================================== -->

<div class="section-title">

    📋 상단 명단

</div>


<div class="table-wrap">

<table>

<thead>

<tr>

    <th>직책</th>

    <th>본캐 닉네임</th>

    <th>부캐릭터</th>

    <th>사천왕</th>

    <th>2차 완료</th>

    <th>각성 완료</th>

    <th>비고</th>

    <th>관리</th>

</tr>

</thead>


<tbody
    id="memberList">
</tbody>

</table>

</div>



<!-- =====================================================
     관리자
===================================================== -->

<div
    id="adminPanel"
    class="admin-panel">


<div class="admin-title">

    🛠 상단원 정보 관리

</div>


<div class="form-grid">


<select id="position">

    <option value="상단명단">
        일반 상단원
    </option>

    <option value="임원진">
        임원진
    </option>

</select>


<input
    id="name"
    placeholder="본캐 닉네임">


<input
    id="subs"
    placeholder="부캐릭터">


<select id="king">

    <option value="보유 없음">
        보유 없음
    </option>

    <option value="지국천왕">
        지국천왕
    </option>

    <option value="다문천왕">
        다문천왕
    </option>

    <option value="광목천왕">
        광목천왕
    </option>

    <option value="증장천왕">
        증장천왕
    </option>

</select>


<input
    id="duty"
    placeholder="직책">


<input
    id="note"
    placeholder="비고">


</div>



<div class="check-area">

<label>

    <input
        type="checkbox"
        id="is2nd">

    2차 완료

</label>


<label>

    <input
        type="checkbox"
        id="isAwaken">

    각성 완료

</label>

</div>



<div class="admin-actions">

<button
    class="admin-btn add-btn"
    onclick="newMember()">

    ➕ 등록 모드

</button>


<button
    class="admin-btn save-btn"
    onclick="saveMember()">

    💾 저장

</button>


<button
    class="admin-btn cancel-btn"
    onclick="clearForm()">

    취소

</button>


<button
    class="admin-btn backup-btn"
    onclick="downloadBackup()">

    📥 명단 백업

</button>

</div>


</div>


</div>


<footer>

    © 2026 大韓民國 상단　|　현무서버 All rights reserved.

</footer>



<script>

/* =====================================================
   Google Apps Script
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbyj3TC79wglpRc2XgVUXdtHYm6cUFTeOB3AJ2dDo1FDxDRsXgD_EAcOVDqF1KVAysZLkA/exec";


/* 관리자 비밀번호 */

const ADMIN_PASSWORD = "1357";


/* 데이터 */

let members = [];

let editId = null;

let adminMode = false;


/* =====================================================
   시작
===================================================== */

window.onload = function(){

    loadMembers();

};


/* =====================================================
   Google Sheet 불러오기
===================================================== */

async function loadMembers(){

    try{

        const response =
            await fetch(
                API_URL +
                "?t=" +
                Date.now()
            );

        const data =
            await response.json();


        if(Array.isArray(data)){

            members =
                data.map(normalizeMember);

        }else{

            members = [];

        }


        render();

    }catch(error){

        console.error(error);

        alert(
            "Google Sheet 연결 실패\n\n" +
            "Apps Script 배포 설정을 확인해주세요."
        );

    }

}


/* =====================================================
   데이터 정리
===================================================== */

function normalizeMember(m){

    return {

        id:
            m.id ||
            createId(),

        name:
            m.name || "",

        subs:
            m.subs || "",

        note:
            m.note || "",

        duty:
            m.duty || "",

        king:
            m.king ||
            "보유 없음",

        position:
            m.position ||
            "상단명단",

        is2nd:
            toBoolean(m.is2nd),

        isAwaken:
            toBoolean(m.isAwaken)

    };

}


/* =====================================================
   TRUE / FALSE
===================================================== */

function toBoolean(value){

    return (
        value === true ||
        value === "true" ||
        value === "TRUE" ||
        value === 1 ||
        value === "1"
    );

}


/* =====================================================
   사천왕 클래스
===================================================== */

function kingClass(king){

    switch(king){

        case "지국천왕":
            return "king-jiguk";

        case "다문천왕":
            return "king-damun";

        case "광목천왕":
            return "king-gwangmok";

        case "증장천왕":
            return "king-jeungjang";

        default:
            return "king-none";

    }

}


/* =====================================================
   화면 출력
===================================================== */

function render(){


    const search =
        document
        .getElementById("search")
        .value
        .trim()
        .toLowerCase();


    const position =
        document
        .getElementById("positionFilter")
        .value;


    const king =
        document
        .getElementById("kingFilter")
        .value;


    const complete =
        document
        .getElementById("completeFilter")
        .value;



    const filtered =
        members.filter(function(m){


            const text =
                (
                    m.name +
                    " " +
                    m.subs +
                    " " +
                    m.duty
                )
                .toLowerCase();


            if(
                search &&
                !text.includes(search)
            ){

                return false;

            }


            if(
                position &&
                m.position !== position
            ){

                return false;

            }


            if(
                king &&
                m.king !== king
            ){

                return false;

            }


            if(
                complete === "2nd" &&
                !m.is2nd
            ){

                return false;

            }


            if(
                complete === "awaken" &&
                !m.isAwaken
            ){

                return false;

            }


            return true;

        });



    /* =================================================
       통계
    ================================================= */


    const executives =
        members.filter(
            m =>
            m.position === "임원진"
        );


    const normal =
        members.filter(
            m =>
            m.position !== "임원진"
        );


    document
        .getElementById("totalCount")
        .textContent =
        members.length;


    document
        .getElementById("execCount")
        .textContent =
        executives.length;


    document
        .getElementById("normalCount")
        .textContent =
        normal.length;


    document
        .getElementById("execTitle")
        .textContent =
        executives.length;



    /* =================================================
       임원진 카드
    ================================================= */


    const execBox =
        document
        .getElementById("executives");


    execBox.innerHTML = "";


    executives.forEach(function(m){

        execBox.innerHTML += `

        <div class="exec-card">

            <div class="exec-name">

                👑 ${escapeHTML(m.name)}

            </div>

            <div class="exec-duty">

                ${escapeHTML(
                    m.duty ||
                    "임원진"
                )}

            </div>

        </div>

        `;

    });



    /* =================================================
       테이블
    ================================================= */


    const list =
        document
        .getElementById("memberList");


    list.innerHTML = "";


    filtered.forEach(function(m){


        const king =
            m.king ||
            "보유 없음";


        list.innerHTML += `

        <tr>


            <td>

                ${escapeHTML(
                    m.duty || "-"
                )}

            </td>


            <td class="main-name">

                ${escapeHTML(
                    m.name
                )}

            </td>


            <td>

                ${escapeHTML(
                    m.subs || "-"
                )}

            </td>


            <td>

                <span
                    class="king-badge ${kingClass(king)}">

                    ${escapeHTML(king)}

                </span>

            </td>


            <td>

                ${
                    m.is2nd

                    ?

                    '<span class="complete">✓</span>'

                    :

                    '<span class="incomplete">-</span>'
                }

            </td>


            <td>

                ${
                    m.isAwaken

                    ?

                    '<span class="complete">✓</span>'

                    :

                    '<span class="incomplete">-</span>'
                }

            </td>


            <td>

                ${escapeHTML(
                    m.note || "-"
                )}

            </td>


            <td>

                ${
                    adminMode

                    ?

                    `

                    <button
                        class="manage-btn edit-btn"
                        onclick="editMember('${escapeHTML(m.id)}')">

                        수정

                    </button>


                    <button
                        class="manage-btn delete-btn"
                        onclick="deleteMember('${escapeHTML(m.id)}')">

                        삭제

                    </button>

                    `

                    :

                    "-"

                }

            </td>


        </tr>

        `;

    });

}


/* =====================================================
   관리자 로그인
===================================================== */

function adminLogin(){

    if(adminMode){

        adminMode = false;

        document
            .getElementById("adminPanel")
            .classList.remove("active");

        render();

        return;

    }


    const password =
        prompt(
            "관리자 비밀번호를 입력하세요."
        );


    if(
        password ===
        ADMIN_PASSWORD
    ){

        adminMode = true;

        document
            .getElementById("adminPanel")
            .classList.add("active");


        alert(
            "관리자 인증 완료!"
        );


        render();

    }else if(password !== null){

        alert(
            "비밀번호가 틀렸습니다."
        );

    }

}


/* =====================================================
   배너 관리자 버튼 클릭
===================================================== */

document
    .querySelector(".header")
    .addEventListener(
        "click",
        function(){

            adminLogin();

        }
    );


/* =====================================================
   신규 등록
===================================================== */

function newMember(){

    editId = null;

    clearForm();

    document
        .getElementById("adminPanel")
        .classList.add("active");

}


/* =====================================================
   수정
===================================================== */

function editMember(id){

    const member =
        members.find(
            m =>
            String(m.id) ===
            String(id)
        );


    if(!member){

        alert(
            "회원을 찾을 수 없습니다."
        );

        return;

    }


    editId =
        member.id;


    document
        .getElementById("name")
        .value =
        member.name;


    document
        .getElementById("subs")
        .value =
        member.subs;


    document
        .getElementById("duty")

/* =====================================================
   저장
===================================================== */

async function saveMember(){

    if(!adminMode){

        alert(
            "관리자 인증이 필요합니다."
        );

        return;

    }


    const name =
        document
        .getElementById("name")
        .value
        .trim();


    if(!name){

        alert(
            "본캐 닉네임을 입력해주세요."
        );

        return;

    }


    const member = {

        id:
            editId ||
            createId(),

        name:name,

        subs:
            document
            .getElementById("subs")
            .value
            .trim(),

        duty:
            document
            .getElementById("duty")
            .value
            .trim(),

        note:
            document
            .getElementById("note")
            .value
            .trim(),

        king:
            document
            .getElementById("king")
            .value,

        position:
            document
            .getElementById("position")
            .value,

        is2nd:
            document
            .getElementById("is2nd")
            .checked,

        isAwaken:
            document
            .getElementById("isAwaken")
            .checked

    };


    const index =
        members.findIndex(
            m =>
            String(m.id) ===
            String(member.id)
        );


    if(index >= 0){

        members[index] =
            member;

    }else{

        members.push(member);

    }


    await saveAll();

}


/* =====================================================
   삭제
===================================================== */

async function deleteMember(id){

    if(
        !confirm(
            "정말 삭제하시겠습니까?"
        )
    ){

        return;

    }


    members =
        members.filter(
            m =>
            String(m.id) !==
            String(id)
        );


    await saveAll();

}


/* =====================================================
   Google Sheet 저장
===================================================== */

async function saveAll(){

    try{

        const response =
            await fetch(
                API_URL,
                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                        "text/plain;charset=utf-8"
                    },

                    body:
                        JSON.stringify(
                            members
                        )

                }
            );


        const result =
            await response.json();


        if(
            result.result !==
            "success"
        ){

            throw new Error(
                result.message ||
                "저장 실패"
            );

        }


        editId = null;

        clearForm();

        render();


        alert(
            "저장 완료!\n\n" +
            "Google Sheet에도 반영되었습니다."
        );


    }catch(error){

        console.error(error);


        alert(
            "저장에 실패했습니다.\n\n" +
            error.message
        );

    }

}

/* =====================================================
   ID 생성
===================================================== */

function createId(){

    return "member_" +
        Date.now() +
        "_" +
        Math.floor(
            Math.random() * 100000
        );

}


/* =====================================================
   백업
===================================================== */

function downloadBackup(){

    const data =
        JSON.stringify(
            members,
            null,
            2
        );


    const blob =
        new Blob(
            [data],
            {
                type:
                "application/json"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    link.href =
        url;


    link.download =
        "대한민국상단_명단백업_" +
        new Date()
        .toISOString()
        .slice(0,10) +
        ".json";


    link.click();


    URL.revokeObjectURL(url);

}


/* =====================================================
   HTML 안전 처리
===================================================== */

function escapeHTML(value){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}
